<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" font-family="'Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',sans-serif">
  <!-- background -->
  <rect width="800" height="1120" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="230" fill="#fbf7e9"/>
  <rect x="0" y="890" width="800" height="230" fill="#fbf7e9"/>
  <!-- palm leaves (simple) -->
  <g fill="#bcd6b0" opacity="0.9">
    <path d="M40 40 q60 20 90 80 q-50 -20 -90 -80z"/>
    <path d="M120 30 q40 40 40 100 q-40 -40 -40 -100z"/>
    <path d="M760 40 q-60 20 -90 80 q50 -20 90 -80z"/>
    <path d="M680 30 q-40 40 -40 100 q40 -40 40 -100z"/>
    <path d="M40 1080 q60 -20 90 -80 q-50 20 -90 80z"/>
    <path d="M760 1080 q-60 -20 -90 -80 q50 20 90 80z"/>
  </g>

  <!-- title -->
  <text x="400" y="340" text-anchor="middle" font-size="58" fill="#333" font-weight="bold">ひげ脱毛範囲表</text>
  <line x1="80" y1="380" x2="720" y2="380" stroke="#ddd" stroke-width="2"/>

  <!-- ===== FRONT FACE ===== -->
  <g transform="translate(60,430)">
    <!-- neck -->
    <path d="M75 190 q0 40 -10 70 l70 0 q-10 -30 -10 -70z" fill="#f6d9c2"/>
    <!-- face -->
    <path d="M60 100 q0 -95 60 -95 q60 0 60 95 q0 90 -60 130 q-60 -40 -60 -130z" fill="#f8e2cf" stroke="#e5c4a8" stroke-width="2"/>
    <!-- hair -->
    <path d="M52 95 q-8 -110 68 -108 q76 -2 68 108 q-12 -70 -68 -66 q-56 -4 -68 66z" fill="#3a2b22"/>
    <path d="M60 92 q10 -40 60 -40 q50 0 60 40 q-5 -55 -60 -55 q-55 0 -60 55z" fill="#2c2019"/>
    <!-- eyes -->
    <ellipse cx="95" cy="105" rx="7" ry="5" fill="#2c2019"/>
    <ellipse cx="145" cy="105" rx="7" ry="5" fill="#2c2019"/>
    <!-- zones: A cheek/sideburn -->
    <path d="M70 108 q-4 40 16 60 q10 -30 8 -62z" fill="#9db4e0" opacity="0.75"/>
    <path d="M170 108 q4 40 -16 60 q-10 -30 -8 -62z" fill="#9db4e0" opacity="0.75"/>
    <!-- B under nose -->
    <rect x="103" y="150" width="34" height="14" rx="5" fill="#9db4e0" opacity="0.85"/>
    <!-- C chin -->
    <path d="M100 172 q20 16 40 0 q-4 24 -20 30 q-16 -6 -20 -30z" fill="#9db4e0" opacity="0.85"/>
    <!-- labels on face -->
    <text x="88" y="140" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c355e">B</text>
    <text x="88" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c355e">C</text>
    <text x="70" y="205" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c355e">D</text>
  </g>

  <!-- ===== callout lines + jp labels ===== -->
  <g font-size="22" fill="#333">
    <line x1="250" y1="520" x2="300" y2="520" stroke="#333" stroke-width="1.5"/>
    <text x="308" y="527">ほほ・もみあげ</text>
    <line x1="250" y1="575" x2="360" y2="575" stroke="#333" stroke-width="1.5"/>
    <text x="368" y="582">鼻下</text>
    <line x1="250" y1="605" x2="360" y2="605" stroke="#333" stroke-width="1.5"/>
    <text x="368" y="612">あご</text>
    <line x1="250" y1="640" x2="300" y2="640" stroke="#333" stroke-width="1.5"/>
    <text x="308" y="647">あご下</text>
  </g>

  <!-- ===== SIDE FACE (A) ===== -->
  <g transform="translate(430,430)">
    <path d="M40 100 q0 -95 55 -95 q45 0 55 60 q6 40 -20 55 q-10 40 -50 60 q-40 -30 -40 -80 q-5 -25 -0 -60z" fill="#f8e2cf" stroke="#e5c4a8" stroke-width="2"/>
    <path d="M35 95 q-6 -108 70 -106 q60 -2 66 70 q-16 -66 -70 -62 q-54 -4 -66 98z" fill="#3a2b22"/>
    <ellipse cx="70" cy="105" rx="6" ry="5" fill="#2c2019"/>
    <!-- A cheek big zone -->
    <path d="M60 115 q40 -6 60 20 q-6 45 -40 70 q-30 -20 -30 -55 q4 -20 10 -35z" fill="#9db4e0" opacity="0.7"/>
    <text x="95" y="165" text-anchor="middle" font-size="26" font-weight="bold" fill="#1c355e">A</text>
    <!-- dashed line to bottom view -->
    <path d="M85 205 q60 60 160 -10" stroke="#e0574f" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  </g>

  <!-- ===== BOTTOM VIEW (D) ===== -->
  <g transform="translate(560,470)">
    <rect x="-10" y="-30" width="230" height="220" fill="none" stroke="#cccccc" stroke-width="1.5"/>
    <text x="105" y="-8" text-anchor="middle" font-size="16" fill="#555">下から顔を見あげた図</text>
    <!-- head from below -->
    <path d="M40 60 q65 -55 130 0 q20 55 -15 105 q-50 45 -100 0 q-35 -50 -15 -105z" fill="#f8e2cf" stroke="#e5c4a8" stroke-width="2"/>
    <path d="M40 60 q65 -60 130 0 q-65 25 -130 0z" fill="#3a2b22"/>
    <!-- D under-chin zone -->
    <path d="M70 95 q35 -35 70 0 q10 40 -35 60 q-45 -20 -35 -60z" fill="#9db4e0" opacity="0.75"/>
    <text x="105" y="135" text-anchor="middle" font-size="26" font-weight="bold" fill="#1c355e">D</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="34" fill="#333">
    <text x="285" y="770">A；頬、もみあげ</text>
    <text x="285" y="815">B；鼻下</text>
    <text x="285" y="860">C；あご</text>
    <text x="285" y="905">D；あご下</text>
  </g>
</svg>
