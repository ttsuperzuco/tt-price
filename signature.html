<script>
/* ★ここは「入口」だけ。中身は毎回 ver.txt を見て、最新の番号のページへ移る。
   こうすると、スマホに古い画面が残っていても必ず新しい画面が出る。 */
(function(){
  var here = '20260902111041';
  function go(v){ location.replace('page-' + v + '.html'); }
  var moved = false;
  function once(v){ if (moved) return; moved = true; go(v); }
  try{
    fetch('ver.txt?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(t){ once(((t||'').trim()) || here); })
      .catch(function(){ once(here); });
  }catch(e){ once(here); }
  /* 取りに行けない時（電波が悪い等）も、4秒で今わかっている番号へ進む */
  setTimeout(function(){ once(here); }, 4000);
})();
</script>
