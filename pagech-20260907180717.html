<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T&amp;T SIGNATURE</title>
<meta name="description" content="TaiwanTomato">
<meta property="og:type" content="website">
<meta property="og:title" content="T&amp;T SIGNATURE">
<meta property="og:description" content="TaiwanTomato">
<meta property="og:url" content="https://ttsuperzuco.github.io/tt-price/signaturech.html">
<meta property="og:site_name" content="TaiwanTomato">
<meta name="twitter:card" content="summary">
</head>
<body style="margin:0"><title>T&amp;T SIGNATURE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=EB+Garamond:ital,wght@1,400;1,500;1,600&family=Shippori+Mincho:wght@400;500;600&family=Noto+Serif+JP:wght@200;300;500;600&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --cream:#faf6f0;
  --cream2:#f2ebe1;
  --ink:#20323a;
  --ink-soft:#5c6f78;
  --teal:#1f6b7d;
  --teal-dark:#164e5c;
  --gold:#b08a4e;
  --gold-soft:#d9c39a;
  --card:#ffffff;
  --line:#e6ddd0;
  --shadow:0 10px 30px rgba(32,50,58,.10);
  --shadow-lift:0 18px 44px rgba(32,50,58,.16);
}

html,body{
  margin:0;padding:0;overflow-x:hidden;
  /* ★Androidが勝手に字を大きくして、はみ出させるのを止める */
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",-apple-system,"Segoe UI",sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:"Hiragino Mincho ProN","Noto Serif JP","Yu Mincho",serif}

/* ★大きさを合わせ終えるまで、字は場所を取ったまま隠しておく。
   （合わせる前に見せると、大きい字が一瞬出てから縮む動きがお客様に見える） */
body:not(.ready) .cap,
body:not(.ready) .intro .ln,
body:not(.ready) .title,
body:not(.ready) .gcard .in,
body:not(.ready) .buy .t,
body:not(.ready) .buy .s{visibility:hidden}

/* 最初の画面は、写真とボタンまでがスマホの1画面にきっちり収まるようにする */
.wrap{
  max-width:760px;margin:0 auto;padding:0 18px;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
}
#viewHome{flex:1;display:flex;flex-direction:column}
/* 帯の下の残りを、見出しとボタンで受け止める（下に空白を余らせない） */
.homelower{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:6px}
/* ボタンが余った分を吸い上げて大きくなる（下に空白を残さない） */
.homelower .gate{flex:1 1 auto;max-height:250px}
.homelower .gcard{height:100%}
#viewList,#viewItem{padding-bottom:64px}

/* ── 上のバー ───────────────────────── */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(250,246,240,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:760px;margin:0 auto;padding:10px 18px;
  display:flex;align-items:center;gap:12px;
}
.brand{
  font-size:15px;letter-spacing:.22em;font-weight:700;color:var(--teal);
  flex:1;white-space:nowrap;
}
.langbtn{
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;
}
.langbtn.on{background:var(--teal);color:#fff;border-color:var(--teal)}

/* ── 戻る ───────────────────────── */
.back{
  display:none;width:100%;margin:14px 0 4px;
  border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(to bottom,#ffb347,#ff9800);
  color:#fff;font-weight:800;font-size:18px;padding:16px;
  box-shadow:0 4px 0 rgba(130,75,0,.45),0 8px 16px rgba(0,0,0,.14);
}
.back:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(130,75,0,.45)}
.show{display:block}

/* ── 表紙（絵がゆっくり入れ替わる） ─────────── */
/* 表紙＝画面の上半分を写真だけで埋める（左右いっぱい・角も落とさない・余白なし） */
.hero{
  position:relative;overflow:hidden;
  width:100vw;margin-left:calc(50% - 50vw);margin-top:0;margin-bottom:0;
  /* ★スマホ用の写真（1600×1600）とぴったり同じ形＝1枚も切れない */
  aspect-ratio:1/1;
}
/* ★パソコンは横長の写真（2000×900）とぴったり同じ形＝ここも切れない */
@media (min-width:780px){
  .hero{aspect-ratio:20/9}
}
.slide{
  position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
.slide.on{opacity:1}
.s1{background:linear-gradient(140deg,#2d7c8e 0%,#1f6b7d 45%,#123f4b 100%)}
.s2{background:linear-gradient(140deg,#c9a978 0%,#a9834b 55%,#6f5227 100%)}
.s3{background:linear-gradient(140deg,#e6d9c6 0%,#cbb493 50%,#8d7a5c 100%)}
/* ── 冒頭の白い光の画面（映画の予告のように、言葉がゆっくり浮かぶ） ───── */
.intro{
  position:absolute;inset:0;z-index:5;
  background:radial-gradient(120% 90% at 50% 42%, #ffffff 0%, #fffdfa 46%, #f6f1e8 100%);
  transition:opacity 1.1s ease;
}
/* 2行ずつのまとまり。どちらも帯のまん中にそろえる（重ねて置く） */
/* ★ここも「まん中ぞろえ」をやめ、字の書き出しを写真の字幕と同じ高さにそろえる */
.intro .grp{
  position:absolute;left:0;right:0;bottom:auto;top:var(--text-top);z-index:3;
  display:flex;flex-direction:column;align-items:center;
  gap:.5em;padding:0 22px;text-align:center;
}
.intro.gone{opacity:0;pointer-events:none}
/* ★一番はじめの画面：まっ白の中に、瓶だけがすーっと浮かび上がる */
.opening{
  position:absolute;inset:0;z-index:7;background:#ffffff;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .8s ease;
}
.opening.off{display:none}
.opening .btl{
  /* 縦450。ただし帯からはみ出さないよう、画面が低い時は帯の82%までにする */
  position:relative;height:min(450px, 82%);
  opacity:0;transform:scale(.93);
  transition:opacity 1.3s ease, transform 1.7s cubic-bezier(.2,.7,.3,1);
}
.opening.lit .btl{opacity:1;transform:none}
.opening .btl img{height:100%;width:auto;display:block}
/* 緑（中身入り）を青（空）の上にぴったり重ねる。同じ1枚の写真から作ってあるので
   位置は完全に一致する＝色が変わる途中で瓶が1ミリも動かない */
.opening .btl .top{position:absolute;left:0;top:0;opacity:1}
/* 上から減らすのではなく、瓶ぜんたいが4秒かけてゆっくり緑から青へ変わる */
.opening.drain .btl .top{opacity:0;transition:opacity 4s linear}
.opening.gone{opacity:0;pointer-events:none}
/* ★次の写真へ移る直前：白い画面が、まん中からじわっと灰色に包まれていき、
   最後は1枚目のクジラの写真とまったく同じ色あいの灰色で画面が埋まる。
   そこから写真へ切り替わるので、境目が分からず自然につながる。 */
.intro .dim,.intro .rays,.intro .core{display:none}   /* 昔の演出の名残（使わない） */
/* ★灰色になりきったあとに出る「映画の題名」の一枚。
   白文字・細めの明朝系・字間を広めにとって、映画のタイトルらしい品を出す。
   英語をほんの少し大きく、日本語はその下に控えめに。 */
.intro .title{
  position:absolute;left:0;right:0;top:50%;z-index:8;
  transform:translateY(-50%);
  padding:0 12px;text-align:center;color:#fff;
  opacity:0;transition:opacity 1.2s ease;
  pointer-events:none;
}
.intro .title.on{opacity:1}
.intro .title.out{opacity:0;transition:opacity .8s ease}
.intro .title .ten{
  font-family:"Cormorant Garamond","EB Garamond",Garamond,serif;
  /* 英語は日本語より小さく、下に添える。必ず1行（入りきらない画面では自動で少し縮む） */
  white-space:nowrap;
  font-weight:400;letter-spacing:.12em;line-height:1.5;
  font-size:clamp(10px,2.5vw,18px);
  margin-top:.9em;
  text-shadow:0 1px 14px rgba(0,0,0,.45);
}
.intro .title .tja{
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  white-space:nowrap;
  font-weight:400;letter-spacing:.14em;line-height:1.6;
  font-size:clamp(13px,3.4vw,25px);
  text-shadow:0 1px 14px rgba(0,0,0,.45);
}
/* ★題名は1文字ずつ浮かび上がる（映画の題名のように・2026-09-04 まるちゃん）。
   場所は最初から全部取っておき、見え方だけを1文字ずつ変える
   （こうすると、打っている途中で行の位置が動かない） */
.intro .title .tja .ch{opacity:0;transition:opacity .16s linear}
.intro .title .tja .ch.on{opacity:1}
/* 英語は、日本語を打ち終わってから静かに出る */
.intro .title .ten{opacity:0}
.intro .title.typed .ten{opacity:.9;transition:opacity 1s ease}
/* 打ち出す時は、題名の枠そのものはすっと出す（ゆっくり浮かぶと打つ動きが見えない） */
.intro .title.typing{transition:opacity .35s ease}
.intro .wash{
  position:absolute;inset:0;pointer-events:none;z-index:6;
  will-change:opacity,transform;
  /* まん中はしっかり灰色、外へいくほど自然に消えていく「1枚だけ」の層。
     これを大きくしていくと、境目のないまま画面が灰色で満ちる。
     （前は〈丸い層〉と〈四角い層〉の2枚だったので、縁が段になって見えていた） */
  background:radial-gradient(circle at 50% 46%,
    rgba(91,83,77,1) 0%,   rgba(91,83,77,1) 22%,  rgba(91,83,77,.88) 38%,
    rgba(91,83,77,.62) 55%, rgba(91,83,77,.34) 72%, rgba(91,83,77,.12) 87%,
    rgba(91,83,77,0) 100%);
  opacity:0;transform:scale(.35);
}
@keyframes fxWash{
  0%  {opacity:0;   transform:scale(.35)}
  100%{opacity:1;   transform:scale(4.2)}
}
.intro.flare .wash{animation:fxWash .9s cubic-bezier(.35,0,.5,1) forwards}
/* 字が、広がってくる灰色にすーっとのまれて見えなくなる */
@keyframes lnFlare{
  0%  {opacity:1;filter:blur(0);transform:none}
  30% {opacity:1;filter:blur(0);transform:scale(1.01)}
  62% {opacity:.45;filter:blur(4px);transform:scale(1.06)}
  100%{opacity:0;filter:blur(11px);transform:scale(1.12)}
}
.intro.flare .l3,.intro.flare .l4{animation:lnFlare .9s ease forwards !important}
.intro .ln{
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  font-weight:400;color:#2b2420;
  line-height:1.55;opacity:0;
  /* ★どの機種でも1行のまま折り返さない（字が1文字だけ次の行に落ちるのを防ぐ）。
     字の大きさは画面の幅から決め、余裕を多めにとってある。 */
  white-space:nowrap;
}
.intro .l1,.intro .l2,.intro .l2b{font-size:clamp(15px,5.2vw,30px);letter-spacing:.16em}
.intro .l3{font-size:clamp(22px,6.8vw,42px);letter-spacing:.2em}
.intro .l4{
  font-size:clamp(24px,7.2vw,44px);font-weight:500;letter-spacing:.14em;
  margin-top:.15em;
}
/* 出したり消したりの間合い（白い光だけの間から始まって、合計およそ7.7秒） */
@keyframes lnIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
@keyframes lnOut{ from{opacity:1} to{opacity:0} }
/* 1行ずつ順番に出して、3行そろってから静かに引く。
   ★1行目は、瓶の画面が消えたらすぐ出る（待たせない） */
.intro .l1 {animation:lnIn .8s ease .85s forwards, lnOut .6s ease 5.65s forwards}
.intro .l2 {animation:lnIn .8s ease 2.05s forwards, lnOut .6s ease 5.65s forwards}
.intro .l2b{animation:lnIn .8s ease 3.25s forwards, lnOut .6s ease 5.65s forwards}
/* 「奇跡の美容成分」と「ホホバエッセンス」は同時に出す */
.intro .l3{animation:lnIn .9s ease 6.5s forwards}
.intro .l4{animation:lnIn .9s ease 6.5s forwards}
@media (prefers-reduced-motion: reduce){
  .intro .l1,.intro .l2,.intro .l2b{animation:none;opacity:0}
  .intro .l3,.intro .l4{animation:none;opacity:1}
  .intro.flare .l3,.intro.flare .l4{animation:none !important;opacity:0}
  .intro.flare .wash{animation:none;opacity:1;transform:scale(4.2)}
}

/* ★ラベルの一枚（2026-09-07 まるちゃん）。「奇跡の美容成分／ホホバエッセンス」のあと、
   「海の哲学者と…ひとつの物語」の字幕の前に、ひと呼吸はさむ。
   絵は差し込む時に、元のデザインをそのままに、クリーム色の地だけを左右に足して
   画面の形ぴったりに作ってあるので、ここでは画面いっぱいに敷くだけでよい。 */
.intro .label{
  /* ★重ねる高さ7＝光のもや(6)より上、物語の題名(8)より下。
     ここを6より下にすると、光のもやに隠れて出ない（2026-09-07に実際に起きた） */
  position:absolute;inset:0;z-index:7;opacity:0;pointer-events:none;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  transition:opacity 1.1s ease;
}
.intro .label.on{opacity:1}

/* 重ねて置く絵（白黒→緑→青と、ゆっくり色がついていく） */
.slide .layer{
  position:absolute;inset:0;opacity:0;
  /* ★はじめから「削っていない」形を書いておく。これが無いと、削る形へ
     なめらかに変われず（形が無い→形あり は途中が作れない）、パッと消えてしまう。 */
  clip-path:inset(0 0 0 0);
  transition:opacity 2.6s ease;
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
.slide .layer.on{opacity:1}
/* 中身が減って現れる方の絵（空の瓶）は、じわっと出さずに最初から置いておく
   ＝上の絵に隠れているので見えない。こうすると減った所が濁らない。 */
.slide .layer.instant{transition:none}
/* 上から中身が減っていく見せ方：上に重ねた緑を、上のふちから少しずつ削って
   下に敷いた青（空の瓶）を現す。削れていく線が液面に見える。
   ★2026-08-31に写真を新しくした（白黒は瓶が写っていない背景だけ、緑と青は瓶あり）。
     測り直すと、緑と青で色が違うのは スマホ51.0〜86.8% / パソコン53.0〜89.2% の帯だけで、
     その上下はまったく同じ絵だった。だから削り始めを 50% に置いても見た目は変わらない。
     ここから始めれば、動いている間ずっと「液面が瓶の中をゆっくり下りる」だけになり、
     一気に減ったように見えない（0%から始めると、瓶より上の何も変わらない所で
     時間を使いきってしまい、肝心の瓶の中を短時間で走り抜けていた）。
   ★パソコン用の3枚も同じように調べたら、色が違うのは 54.2%〜91.3% の帯だけだった。
     どちらも50%から始めれば見た目が変わらないので、スマホもパソコンも同じ50%にした。 */
.slide{--drain-from:50%}
.slide .layer.drain-start{clip-path:inset(var(--drain-from) 0 0 0);transition:none}
.slide .layer.drained{
  clip-path:inset(90% 0 0 0);       /* 瓶の底まで＝ここから下は2枚とも同じ絵 */
  /* 段をつけて減らす（一気に流れるより液面らしい）。
     ★2026-09-04 まるちゃん「かくかくしてる」＝5段では段差が大きすぎたので20段にし、
     2026-09-05 にさらに30段へ。7秒を30回に分ける＝0.23秒ごとに下りるので段はほぼ見えない */
  transition:clip-path 7s steps(30, start);
}

/* ── 写真の上に書く字幕（絵に焼き込まず、ページが書く） ───── */
.cap{
  position:absolute;inset:0;z-index:2;
  /* ★上下のまん中ぞろえだけをやめて、書き出しの高さを全部の画面でそろえる。
     （左右のそろえ方は今までどおり＝字のかたまりは中身の幅ちょうどで真ん中に置く。
       ここを変えると、瓶ぎわに寄せた最後の2行の位置がずれる） */
  display:flex;align-items:flex-start;justify-content:center;
  padding:10px;text-align:center;
  padding-top:var(--text-top,10px);
  /* 明るい写真でも白い字が沈まないように、真ん中だけうっすら影を敷く */
  background:linear-gradient(to bottom,
    rgba(0,0,0,0) 26%, rgba(0,0,0,.34) 40%,
    rgba(0,0,0,.34) 62%, rgba(0,0,0,0) 76%);
}
.cap{overflow:hidden}                      /* 万一はみ出しても帯の外へ出さない */
/* 書き出しの高さ＝帯の上から何割の所か。5枚とも・冒頭の白い光の画面とも同じ値を使う */
.slide,.intro{--text-top:35%}
.cap .in{
  max-width:min(98%,760px);min-width:0;
  /* 行数が多くて帯の下からはみ出す画面だけ、書き出しの高さは変えずに全体を少し小さくする */
  transform:scale(var(--cap-scale,1));transform-origin:top center;
}
.cap .nb{white-space:nowrap;display:inline-block}
/* 1行ずつ順番に浮かび上がらせる（写真の字幕） */
.cap .in.stepped .line,
.cap .in.stepped .en{opacity:0;transition:opacity .55s ease}
.cap .in.stepped .line.lit{opacity:1}
.cap .in.stepped .en.lit{opacity:.92}

.cap .ja{
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color:#fff;letter-spacing:.08em;line-height:1.55;
  font-size:clamp(17px,5.4vw,34px);
  text-shadow:0 2px 12px rgba(0,0,0,.6), 0 0 2px rgba(0,0,0,.5);
}
.cap .en{
  font-family:"EB Garamond",Garamond,serif;font-style:italic;
  color:#fff;opacity:.92;letter-spacing:.03em;line-height:1.5;
  font-size:clamp(11px,3.0vw,19px);margin-top:.5em;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}

/* 2段階で出す字幕。「それが」→ 少し間をおいて商品名が右へ、劇的に現れる
   （※この3つは上の .cap .ja / .cap .en より後ろに置くこと。順番が逆だと効かない） */
/* 4行を1行ずつ縦に並べる（各行は中身の幅ちょうどになる） */
.cap .ja4{display:flex;flex-direction:column;align-items:center;gap:.3em}
.cap .p1{opacity:0;transition:opacity 1.0s ease}
.cap .p1.lit{opacity:1}
.cap .p2{
  opacity:0;transform:scale(1.45);filter:blur(8px);
  transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.16,.9,.2,1), filter 1.1s ease;
}
.cap .p2.lit{opacity:1;transform:none;filter:none}
.cap .en.p3{opacity:0;transition:opacity 1.1s ease}
.cap .en.p3.lit{opacity:.92}
/* 2行目・3行目。青くなり始めた時に、ゆっくり静かに立ち上がる（荘厳に） */
.cap .p4,.cap .p5,.cap .p6{
  opacity:0;transform:translateY(12px) scale(1.06);
  transition:opacity 1.8s ease, transform 1.8s cubic-bezier(.16,.9,.2,1);
}
.cap .p4.lit,.cap .p5.lit,.cap .p6.lit{opacity:1;transform:none}
/* 最後の2行は、明るい地面の上に重なるので、字のまわりに濃い影をしっかり付けて読めるようにする */
.cap .side .nb{
  text-shadow:0 1px 2px rgba(0,0,0,.95), 0 0 10px rgba(0,0,0,.9),
              0 0 22px rgba(0,0,0,.82), 0 0 42px rgba(0,0,0,.6);
}
/* 最後の2行は、瓶にかからないように左寄せで置く（瓶は絵の右側にある） */
.cap .side{
  align-self:flex-start;display:flex;flex-direction:column;align-items:flex-start;
  gap:.25em;margin-left:3%;max-width:50%;margin-top:.15em;
  /* 瓶にぎりぎり触れる位置まで右へ（瓶の左ふち＝スマホ59%・パソコン66%、ラベルは62%・70%から） */
  transform:translateX(7vw);
}
/* パソコンでは全部の行を中央ぞろえにする */
@media (min-width:780px){
  .cap .side{align-self:center;align-items:center;max-width:none;margin-left:0;transform:none}
}
@media (prefers-reduced-motion: reduce){
  .cap .p2{transform:none;filter:none}
}

.dots{
  position:absolute;left:0;right:0;bottom:12px;z-index:6;
  display:flex;gap:7px;justify-content:center;
  opacity:0;transition:opacity .8s ease;
}
.dots.show{opacity:1}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.dot.on{background:#fff;width:20px;border-radius:99px}

/* ── 見出し ───────────────────────── */
.lede{text-align:center;margin:20px 0 4px}
.lede .en{font-size:11px;letter-spacing:.34em;color:var(--gold);font-weight:700}
.lede h1{
  font-family:"EB Garamond",Garamond,"Times New Roman",serif;
  font-style:italic;font-weight:500;
  color:#4a3b30;
  font-size:clamp(24px,6.4vw,38px);margin:0;letter-spacing:.01em;line-height:1.2;
}
.lede p{color:var(--ink-soft);font-size:14px;margin:10px 0 0}

/* ── 入口の2枚 ───────────────────── */
/* 左＝オリジナル／右＝セレクト の横ならび */
.gate{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px}
/* とても細い画面（小さな窓で開いた時など）は、横に並べると文字が潰れるので縦に積む */
@media (max-width:345px){
  .gate{grid-template-columns:1fr}
  .gcard{min-height:118px}
}
.gcard{
  position:relative;border-radius:20px;overflow:hidden;cursor:pointer;
  border:none;padding:0;text-align:left;color:#fff;
  box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;
  min-height:168px;display:block;width:100%;font-family:inherit;
}
.gcard:active{transform:translateY(2px)}
.gcard:hover{box-shadow:var(--shadow-lift)}
.gcard .bg{position:absolute;inset:0}
.g1 .bg{background:linear-gradient(135deg,#2a7688 0%,#164e5c 100%)}
.g2 .bg{background:linear-gradient(135deg,#bf9c68 0%,#7d5f30 100%)}
/* 左寄せの大きなボタン。上に日本語（小さく）／下に英語（大きく） */
.gcard .in{
  position:relative;z-index:2;padding:20px 12px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  height:100%;text-align:left;
}
/* 上のちいさな肩書き（日本語）＝いちばん小さく */
.gcard .jp{
  font-size:clamp(8.5px,2.35vw,11px);letter-spacing:.16em;opacity:.82;
  white-space:nowrap;margin:0 0 7px;
}
/* 主役の大きな名前（英語） */
.gcard .en{
  font-size:clamp(23.5px,6.4vw,34px);font-weight:700;letter-spacing:.07em;
  white-space:nowrap;line-height:1.05;margin:0 0 10px;
}
/* 下の説明書き */
.gcard .ds{
  font-size:clamp(11px,3.0vw,13.5px);line-height:1.55;opacity:.9;
  white-space:nowrap;   /* 決めた2行のまま。勝手に3行にならない */
}

/* ── 商品の並び ───────────────────── */
.sechead{margin:22px 0 14px;text-align:center}
.sechead .en{font-size:11px;letter-spacing:.32em;color:var(--gold);font-weight:700}
.sechead h2{font-size:clamp(20px,4.8vw,25px);margin:6px 0 0;font-weight:600;letter-spacing:.05em}

.items{display:grid;gap:14px}
.item{
  display:flex;gap:14px;align-items:stretch;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:12px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;
  box-shadow:0 4px 14px rgba(32,50,58,.06);transition:transform .16s,box-shadow .16s;
}
.item:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.item:active{transform:translateY(1px)}
.thumb{
  width:96px;min-width:96px;height:96px;border-radius:13px;overflow:hidden;
  background:linear-gradient(135deg,var(--cream2),#e2d6c3);
  display:flex;align-items:center;justify-content:center;
  color:#a8987f;font-size:10.5px;text-align:center;padding:6px;line-height:1.4;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.itxt{flex:1;min-width:0;padding:2px 2px 2px 0}
.itxt .nm{font-size:16.5px;font-weight:700;line-height:1.4}
.itxt .sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
.itxt .one{font-size:13px;color:var(--ink-soft);margin-top:7px;line-height:1.6}
.price{margin-top:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price .now{font-size:19px;font-weight:800;color:var(--teal)}
.price .was{font-size:12.5px;color:#9aa8ae;text-decoration:line-through}
.tagrow{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.tag{
  font-size:11px;padding:3px 9px;border-radius:999px;
  background:#eef5f6;color:var(--teal);font-weight:700;
}
.tag.gold{background:#f7f0e2;color:var(--gold)}
.tag.warn{background:#fdeeee;color:#b4544f}

/* ── まとめ買い ───────────────────── */
.setbox{
  margin:20px 0 4px;background:linear-gradient(135deg,#fdf8ef,#f6ecd9);
  border:1px solid var(--gold-soft);border-radius:18px;padding:18px 20px;
}
.setbox h3{margin:0 0 10px;font-size:16px;letter-spacing:.05em;color:var(--gold)}
.setrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14.5px}
.setrow+.setrow{border-top:1px dashed var(--gold-soft)}
.setrow b{color:var(--teal);font-size:16px;white-space:nowrap}

/* ── 商品の詳しい画面 ─────────────── */
.dhero{
  /* 商品の写真は 正方形（例 1200×1200）。一覧の小さい四角と同じ1枚を使う */
  border-radius:20px;overflow:hidden;margin:14px auto 0;
  width:100%;max-width:420px;aspect-ratio:1/1;
  background:linear-gradient(135deg,var(--cream2),#ded0ba);
  display:flex;align-items:center;justify-content:center;
  color:#9d8c72;font-size:13px;text-align:center;padding:20px;box-shadow:var(--shadow);
}
.dhero img{width:100%;height:100%;object-fit:cover;display:block}
.dname{font-size:clamp(21px,5.2vw,26px);font-weight:700;margin:18px 0 4px;line-height:1.4}
.dsub{color:var(--ink-soft);font-size:13px}
/* 左＝通常の値段（線で消す・名前なし）／右＝当店の値段（名前つき・大きく） */
.dprice{margin:16px 0 2px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.dprice .pc{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.dprice .lb{
  font-size:9.5px;letter-spacing:.24em;font-weight:700;color:var(--gold);
  white-space:nowrap;
}
.dprice .now{font-size:30px;font-weight:800;color:var(--teal);line-height:1}
.dprice .was{font-size:16px;color:#9aa8ae;text-decoration:line-through;line-height:1.2}
.dbody{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 20px;margin:16px 0 0;font-size:14.5px;line-height:1.85;white-space:pre-wrap;
}
.note{
  margin-top:12px;background:#fbf4e8;border:1px solid var(--gold-soft);
  border-radius:14px;padding:13px 16px;font-size:13px;color:#7a6437;line-height:1.75;
}
.buys{display:grid;gap:12px;margin:22px 0 0}
.buy{
  display:block;width:100%;border:none;border-radius:16px;cursor:pointer;
  padding:19px 16px;font-size:18px;font-weight:800;font-family:inherit;text-align:center;
  text-decoration:none;
}
.buy.line{
  background:linear-gradient(to bottom,#2a8f5f,#1e7049);color:#fff;
  box-shadow:0 4px 0 rgba(15,70,45,.45),0 10px 20px rgba(0,0,0,.12);
}
.buy.net{
  background:linear-gradient(to bottom,#fff,#f0e8db);color:var(--teal-dark);
  border:2px solid var(--gold-soft);
  box-shadow:0 4px 0 rgba(150,120,70,.22),0 10px 20px rgba(0,0,0,.08);
}
.buy:active{transform:translateY(2px)}
/* ★ボタンの字は「絶対に折り返さない」。入らない時は fitBuys が字を詰めて必ず収める
   （帯の字幕・2つの大きなボタンと同じやり方。機種による字の太さの違いで欠けるのを防ぐ） */
/* ★字と字のすき間は最後の1文字のうしろにも付くので、そのぶん右が広く見える。
   同じ幅だけ左に足して、左右の余白をきっちりそろえる（2026-09-06 まるちゃん）。 */
.buy .t{display:block;white-space:nowrap;text-indent:.12em}
.buy .s{display:block;white-space:nowrap;font-size:12.5px;font-weight:600;opacity:.85;margin-top:4px;text-indent:.02em}

/* ── お店で受け取る時のお支払い（LINE Pay／街口支付／銀行振込を選ぶ） ───── */
.pays{margin:18px 0 0;text-align:center}
.pays .ttl{
  font-size:10.5px;letter-spacing:.3em;color:var(--gold);font-weight:700;
}
.pays .row{
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px;
}
.pays .pay{
  border:1px solid var(--gold-soft);border-radius:999px;
  padding:9px 16px;font-size:13px;font-weight:700;color:#7a6437;background:#fbf4e8;
  white-space:nowrap;cursor:pointer;font-family:inherit;
}
.pays .pay.on{background:var(--gold);color:#fff;border-color:var(--gold)}

.paybox{margin-top:18px}
.payqr{
  display:block;width:210px;max-width:72%;margin:0 auto;
  background:#fff;padding:10px;border-radius:8px;
}
.qrtodo{
  width:210px;max-width:72%;margin:0 auto;aspect-ratio:1/1;
  border:1px dashed var(--gold-soft);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;color:#9a8557;text-align:center;padding:10px;
}
.payamt{
  font-family:"EB Garamond",serif;font-size:30px;font-weight:600;
  color:var(--gold);margin:14px 0 0;letter-spacing:.04em;
}
.paysteps{
  text-align:left;max-width:340px;margin:14px auto 0;
  font-size:13.5px;line-height:1.95;color:var(--ink-soft);
}
.paysteps b{color:var(--gold);font-size:16px}
.bankbox{
  max-width:340px;margin:14px auto 0;text-align:left;
  border:1px solid var(--gold-soft);border-radius:12px;padding:14px 16px;
  font-size:14px;line-height:2;background:#fbf4e8;color:#7a6437;
}
.todoline{color:#9a8557;font-size:12.5px}
.buy.order{margin-top:18px}
.buy.paygo{margin-top:16px}
/* 画面2・3の上に出す「いま何をいくらで買おうとしているか」 */
.stephead{text-align:center;margin:10px 0 26px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.stephead .nm{
  font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
  font-size:20px;letter-spacing:.08em;line-height:1.5;
}
.stephead .pr{
  font-family:"EB Garamond",serif;font-size:28px;font-weight:600;
  color:var(--gold);letter-spacing:.04em;margin-top:6px;
}
.stepttl{
  text-align:center;font-size:10.5px;letter-spacing:.3em;
  color:var(--gold);font-weight:700;margin-bottom:14px;
}
body.dark .stephead{border-bottom-color:rgba(201,171,115,.28)}
body.dark .stephead .nm{color:#f5efe5}
body.dark .stephead .pr{color:#e8d3a6}
/* ★上の見出し＝左に商品の写真、右に名前と金額（2026-09-02 まるちゃん）。
   写真の高さは、名前の上から金額の下までとほぼ同じ。 */
body.dark .stephead{
  display:flex;align-items:center;justify-content:center;gap:14px;text-align:left;
}
body.dark .stephead .pic{
  flex:0 0 auto;width:76px;height:76px;object-fit:cover;
  border-radius:2px;background:#151210;display:block;
}
body.dark .stephead .tx{min-width:0}
body.dark .stephead .pr{margin-top:4px}
/* 「お受け取り方法をお選びください」は小さすぎたので大きく */
body.dark .stepttl{color:#c9ab73;font-size:15px;letter-spacing:.22em;margin-bottom:18px}
/* お受け取り方法の2つのボタンは、文字を大きくどっしり見せる */
body.dark #stepWay .buy{padding:26px 18px}
body.dark #stepWay .buy .t{font-size:21px;letter-spacing:.14em}
.qrside{margin-top:18px}
.qrnote{margin-top:8px;font-size:12px;color:var(--ink-soft);text-align:center}
body.dark .qrnote{color:#a2947f}
/* 「◯◯を購入する」は商品名が入るので、長い名前でも収まるように折り返す */
.buy.start{font-size:17px;line-height:1.45;word-break:normal;overflow-wrap:anywhere}
#stepWay .buys{margin-top:0}

.foot{
  margin:40px 0 0;text-align:center;color:var(--ink-soft);font-size:12px;line-height:1.9;
}

/* ══════ 商品の一覧・詳しい画面を「高級感のある暗い世界」にそろえる ══════
   （上の映像の続きに見えるよう、白いカードをやめて写真を主役にする） */
/* 背景は「セレクト」のボタンと同じ深い青緑 */
body.dark{
  background:linear-gradient(160deg,#22707f 0%,#1a5a69 45%,#123f4b 100%) fixed;
  color:#eef3f2;
}
body.dark .wrap{background:none}

/* 戻るボタン：オレンジの塊をやめ、細い金の線に */
body.dark .back{
  background:none;color:#e7dcc9;font-weight:500;font-size:13px;
  letter-spacing:.24em;padding:13px;border:1px solid rgba(214,186,138,.45);
  border-radius:2px;box-shadow:none;margin:18px 0 6px;
}
body.dark .back:active{transform:none;background:rgba(214,186,138,.08)}

/* 見出し */
body.dark .sechead{margin:26px 0 26px}
body.dark .sechead .en{color:#c9ab73;letter-spacing:.42em;font-size:10.5px;font-weight:600}
body.dark .sechead h2{
  font-family:"EB Garamond",Garamond,serif;
  font-weight:500;letter-spacing:.22em;margin-top:0;color:#c9ab73;
}
body.dark .sechead h2::after{
  content:"";display:block;width:38px;height:1px;background:#c9ab73;
  margin:16px auto 0;opacity:.8;
}

/* 商品：写真を大きく、文字は下に静かに */
/* ★一覧は「1行に2枚」＝画面を半分ずつ使う（まるちゃん指示・2026-09-02。
   2026-08-31の「1行に3枚」は小さすぎたので取り消し）
   写真の下は 商品名・量・金額だけ。その下に「詳細を見る」。写真を押しても詳しい画面へ飛ぶ */
/* ★「前へ戻る」の右に置く「もう一方へ切り替える」ボタン（2026-09-06 まるちゃん）。
   前へ戻る＝3分の1、切り替える＝3分の2。細い金の枠だけの控えめな作りで、2行で出す。 */
body.dark .backrow{display:flex;gap:10px;align-items:stretch}
body.dark .backrow .back{flex:1 1 0;min-width:0;margin:18px 0 6px}
body.dark .backrow .lswbtn{flex:2 1 0;min-width:0;margin:18px 0 6px}
/* 一覧でない画面＝切り替えボタンは出ないので、前へ戻るが横いっぱいになる */
body.dark .lswbtn{
  border:1px solid rgba(201,171,115,.55);border-radius:2px;
  color:#c9ab73;font-family:inherit;cursor:pointer;
  padding:9px 10px;line-height:1.3;text-align:center;
  display:flex;flex-direction:column;justify-content:center;
  /* ★行き先の色をうすく敷く（2026-09-06 まるちゃん）。
     ホームの2枚の面（オリジナル＝金茶／セレクト＝青緑）と同じ色づかいなので、
     全体の色のまとまりをこわさない。金の面の「詳細を見る」とも別物に見える。 */
  background:linear-gradient(135deg,#17505e 0%,#0d3542 100%);
}
/* 行き先がオリジナル商品の時＝金茶のうすい面 */
body.dark .lswbtn.to-original{
  background:linear-gradient(135deg,#7d6440 0%,#523c20 100%);
  border-color:rgba(232,211,166,.55);color:#eddcbb;
}
body.dark .lswbtn.to-original .b{color:#d8c49b}
/* 行き先がセレクト商品の時＝青緑のうすい面 */
body.dark .lswbtn.to-select{
  background:linear-gradient(135deg,#17505e 0%,#0d3542 100%);
  border-color:rgba(150,201,214,.55);color:#dceef3;
}
body.dark .lswbtn.to-select .b{color:#a9cbd5}
body.dark .lswbtn .a{display:block;font-size:12px;font-weight:700;letter-spacing:.16em}
body.dark .lswbtn .b{display:block;font-size:10.5px;letter-spacing:.08em;color:#a3937a;margin-top:3px}
body.dark .lswbtn:active{background:rgba(201,171,115,.14)}
body.dark .items{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px;
}
/* 商品が1つだけの時は、まん中に少し大きめで1枚 */
body.dark .items.one{grid-template-columns:1fr;justify-items:center}
body.dark .items.one .item{width:66%;min-width:200px}
/* ★セットの品は、その行を1つで使い、まん中に大きく置く（2026-09-03 まるちゃん） */
body.dark .items .item{min-width:0}
body.dark .items .item .nm{white-space:nowrap;max-width:100%}
body.dark .items .item .szn{white-space:nowrap}
body.dark .items .item.wide{grid-column:1 / -1;width:62%;min-width:210px;margin:0 auto}
/* 大きさが2つある品の値段（130ml ◯◯元／200ml ◯◯元） */
body.dark .price.sz{flex-direction:column;align-items:center;gap:3px}
body.dark .price.sz .szrow{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
body.dark .price.sz .szn{font-size:11.5px;color:#c1b6a6;letter-spacing:.04em}
body.dark .price.sz .now{font-size:15px}

/* ★まだ発売前の商品の「COMING SOON」の面（2026-09-02 まるちゃん）。
   ★動きは付けない（気になると言われた）。止まったままの1枚の絵として高級感を出す。 */
body.dark .item.soon{cursor:default}
.thumb.comingsoon{
  position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;overflow:hidden;
  /* 重ねているもの（上から順に）
     ①斜めに走る太い光　②その少しあとを追う細い光　③絹のような細かい縦の織り
     ④上からの淡い光　⑤四隅に落ちる陰　⑥地の色（深い夜） */
  background:
    linear-gradient(114deg,
      rgba(255,246,228,0) 30%, rgba(255,246,228,.10) 41%, rgba(255,246,228,.19) 45.5%,
      rgba(255,246,228,.05) 50%, rgba(255,246,228,0) 57%),
    linear-gradient(114deg,
      rgba(255,246,228,0) 61%, rgba(255,246,228,.075) 65.5%, rgba(255,246,228,0) 69%),
    repeating-linear-gradient(100deg,
      rgba(255,255,255,.02) 0 1px, rgba(255,255,255,0) 1px 4px),
    radial-gradient(100% 72% at 50% 2%,  rgba(232,211,166,.26) 0%, rgba(232,211,166,.05) 38%, rgba(232,211,166,0) 62%),
    radial-gradient(118% 118% at 50% 46%, rgba(0,0,0,0) 26%, rgba(0,0,0,.62) 100%),
    linear-gradient(163deg,#0f3b47 0%,#08242d 52%,#03111a 100%);
  border:1px solid rgba(201,171,115,.38);
  box-shadow:inset 0 1px 0 rgba(255,246,228,.14), inset 0 -18px 34px rgba(0,0,0,.35);
}
/* 内側にもう一本の細い枠＝額装したような佇まい */
.thumb.comingsoon .frame{
  position:absolute;inset:10px;border:1px solid rgba(201,171,115,.24);pointer-events:none;
}
/* 枠の左上と右下に、金の短いかぎ印（宝飾箱の留め金のような佇まい） */
.thumb.comingsoon .frame::before,
.thumb.comingsoon .frame::after{
  content:"";position:absolute;width:13px;height:13px;
  border:1px solid rgba(224,199,152,.85);
}
.thumb.comingsoon .frame::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.thumb.comingsoon .frame::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.thumb.comingsoon .cs{
  position:relative;z-index:2;
  font-family:"Cormorant Garamond","EB Garamond",serif;
  font-size:clamp(15px,4.6vw,22px);font-weight:300;line-height:1.3;
  letter-spacing:.38em;text-indent:.38em;text-align:center;color:#ecd9b0;
  text-shadow:0 1px 10px rgba(0,0,0,.55);
}
/* 金の箔押しのような、わずかな濃淡をつけた文字（使えない機種は上の色のまま） */
@supports (-webkit-background-clip:text) or (background-clip:text){
  .thumb.comingsoon .cs{
    background:linear-gradient(176deg,#fdf1d8 0%,#e6cd9c 38%,#c2a068 58%,#f2e0bc 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    text-shadow:none;
    filter:drop-shadow(0 1px 7px rgba(0,0,0,.5));
  }
}
/* 文字の下に、細い金の線を一本だけ（両端が消えていく） */
.thumb.comingsoon .rule{
  position:relative;z-index:2;display:block;width:46px;height:1px;
  background:linear-gradient(to right,
    rgba(201,171,115,0) 0%, rgba(232,211,166,.9) 50%, rgba(201,171,115,0) 100%);
  box-shadow:0 0 6px rgba(232,211,166,.35);
}
/* 名前も少し落ち着いた色にして、売っている商品と見分けがつくように */
body.dark .item.soon .itxt .nm{color:#e6ddd0}
body.dark .item{
  display:flex;flex-direction:column;background:none;border:none;box-shadow:none;padding:0;
  text-align:center;
}
body.dark .item:hover{transform:none;box-shadow:none}
body.dark .thumb{
  width:100%;min-width:0;height:auto;aspect-ratio:1/1;border-radius:2px;
  background:rgba(0,0,0,.22);color:#9fb8bd;font-size:10px;
}
body.dark .itxt{flex:1;display:flex;flex-direction:column;padding:9px 1px 0}
body.dark .itxt .nm{
  font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
  font-size:15px;font-weight:400;letter-spacing:.03em;color:#f5efe5;line-height:1.55;
}
body.dark .itxt .sub{
  font-family:"EB Garamond",serif;font-style:italic;
  color:#c9ab73;font-size:12.5px;letter-spacing:.04em;margin-top:3px;
}
/* 「詳細を見る」は一番下にそろえる（名前の長さがちがっても高さが合う） */
body.dark .detail{margin-top:auto}
/* 値段と「詳細を見る」の間に、量と値段の間と同じくらいの隙間をあける */
body.dark .price{justify-content:center;margin-top:6px;margin-bottom:9px;gap:5px}
body.dark .price .now{
  font-family:"EB Garamond",serif;font-weight:500;color:#f0e6d6;
  font-size:18px;letter-spacing:.03em;
}
body.dark .price .was{color:#7d7263;font-size:12px}

/* 一覧の「詳細を見る」（写真と同じく、押すと詳しい画面へ飛ぶ）
   ★押すボタンなので、購入ボタンと同じ金の面にそろえる（2026-09-02 まるちゃん） */
.detail{
  margin-top:10px;border:1px solid rgba(255,246,228,.5);border-radius:2px;
  padding:12px 6px;font-size:12.5px;letter-spacing:.14em;font-weight:700;
  text-align:center;white-space:nowrap;
  background:linear-gradient(180deg,#e2caa0 0%,#cdad74 48%,#b7915a 100%);
  color:#0f333d;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 8px 20px rgba(0,0,0,.25);
}
.item:active .detail{
  background:linear-gradient(180deg,#cdad74,#a5814a);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 3px 10px rgba(0,0,0,.3);
}
body.dark .tagrow{justify-content:center;margin-top:12px}
body.dark .tag{
  background:none;border:1px solid rgba(201,171,115,.5);color:#d5bd91;
  font-weight:500;letter-spacing:.04em;
}
body.dark .tag.warn{border-color:rgba(200,120,110,.6);color:#d69b93}

/* まとめ買い */
body.dark .setbox{
  background:none;border:1px solid rgba(201,171,115,.35);border-radius:2px;
}
body.dark .setbox h3{
  color:#c9ab73;font-family:"Shippori Mincho",serif;font-weight:400;letter-spacing:.2em;
}
body.dark .setrow{color:#e6dccd}
body.dark .setrow+.setrow{border-top:1px solid rgba(201,171,115,.22)}
body.dark .setrow b{color:#f0e6d6;font-family:"EB Garamond",serif;font-weight:500}

/* 詳しい画面 */
body.dark .dhero{
  /* 商品の写真は横幅いっぱいの3分の2。左右に余白を残す（まるちゃん指示・2026-08-31） */
  max-width:66.7%;aspect-ratio:4/5;border-radius:2px;background:#151210;
  color:#6d6255;box-shadow:none;
}
/* ★「◯◯を購入する」までが1画面に収まるようにする（2026-09-02 まるちゃん）。
   写真の枠が余った高さを吸い上げ、画面が短い時は枠が縮む。
   写真そのものは切り取らず、枠の中にきちんと収める（背景と同じ暗い色なので継ぎ目は見えない）。 */
#viewItem{flex:1 1 auto;min-height:0;flex-direction:column;padding-bottom:14px}
body.dark #stepItem{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
}
/* ★写真は正方形なので、枠も正方形にする（2026-09-03）。
   こうすると上下や左右に帯（余った所）が出ない＝明るい写真でも継ぎ目が見えない。
   大きさ（1辺）は fitItem が測って決める。 */
body.dark #stepItem .dhero{
  flex:0 0 auto;aspect-ratio:1/1;
  max-width:66.7%;margin:10px auto 0;padding:0;
}
body.dark #stepItem .dhero img{object-fit:cover}
/* 2枚並び（2026-09-07 まるちゃん）＝横に半分ずつ。写真は正方形なので切れずに収まる */
body.dark #stepItem .dhero.two{display:flex;gap:6px}
body.dark #stepItem .dhero.two img{width:calc(50% - 3px);height:100%;object-fit:cover}
/* 文字まわりの間を少し詰めて、ボタンまで入りやすくする */
body.dark #stepItem .dname{margin-top:16px}
body.dark #stepItem .dprice{margin-top:14px}
body.dark #stepItem .dbody{padding-top:14px;margin-top:16px}
body.dark #stepItem .buys{margin-top:14px;margin-bottom:0}
/* 画面の縦が短い機種では、文字まわりの間をさらに詰める（fitItem が付け外しする） */
body.dark #stepItem.tight .dname{margin-top:10px;font-size:clamp(18px,4.6vw,22px)}
body.dark #stepItem.tight .dsub{margin-top:5px}
body.dark #stepItem.tight .dprice{margin-top:9px}
body.dark #stepItem.tight .dbody{padding-top:11px;margin-top:11px;font-size:13px;line-height:1.7}
body.dark #stepItem.tight .buys{margin-top:11px}
/* ★映像の最後の言葉を、写真の中に白い字で重ねる（2026-09-03 まるちゃん）。
   瓶は写真の右寄りにいるので、字は左上に置いて邪魔をしない。
   字の大きさは写真の大きさに合わせて fitItem が決める（どの機種でも同じ見え方）。 */
body.dark .dhero{position:relative}
body.dark .dlead{
  /* 縦は写真のちょうど真ん中・字は中央そろえ（2026-09-03 まるちゃん）。
     瓶は右にいるので、写真の左半分を持ち場にして、その中で真ん中にそろえる */
  position:absolute;left:4%;width:54%;top:50%;transform:translateY(-50%);
  z-index:2;pointer-events:none;
  /* ★書体は「上の映像の字幕とまったく同じ物」にする（2026-09-07 まるちゃん
     「映像の字体と違うように見える」）。ここは映像の最後の言葉をそのまま写真に重ねる場所なので、
     映像と別の書体だと同じ言葉なのに別物に見えてしまう。
     ※上の .cap .ja（映像の字幕）と必ず同じにそろえること。片方だけ変えない。
     字と字の間を広く取るのは今までどおり（2026-09-03 まるちゃん「ポップすぎる」への手当て）。 */
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  font-weight:400;text-align:center;color:#fff;
  letter-spacing:.22em;text-indent:.22em;line-height:2.3;
  text-shadow:0 1px 5px rgba(0,0,0,.8), 0 0 20px rgba(0,0,0,.55);
}
body.dark .dlead span{display:block;white-space:nowrap}
/* 字が乗る左側だけ、ほんの少し暗くして読みやすくする（右の瓶には掛からない） */
body.dark .dhero.hasLead::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(118deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.26) 34%,rgba(0,0,0,0) 62%);
}
/* ★白っぽい写真に言葉を重ねる時の形（2026-09-06 まるちゃん・VIO専用泡ソープ）。
   絹の写真は全体が明るいので、白い字はどこに置いても読めない。そこで
   ・字は濃い温かみのある灰色（黒よりやわらかく、化粧品の広告らしい）
   ・置き場所は写真のいちばん上＝商品が写っていない絹だけの帯（実際に測って決めた）
   ・後ろにごく薄い白のもやを敷いて、絹の柄に紛れないようにする              */
body.dark .dhero.leadLight .dlead{
  left:6%; width:88%; top:7%; transform:none;
  /* ★2026-09-06 まるちゃん「字が目立たない」→ 濃さと太さを上げた。
     ただし太いゴシックにはせず、明朝のまま中太にして品を保つ。 */
  color:#241e19; font-weight:600;
  line-height:1.85; letter-spacing:.12em; text-indent:.12em;
  text-shadow:0 1px 2px rgba(255,255,255,.98), 0 0 10px rgba(255,255,255,.95),
              0 0 22px rgba(255,255,255,.85), 0 0 40px rgba(255,255,255,.6);
}
body.dark .dhero.leadLight.hasLead::after{
  background:linear-gradient(180deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.72) 18%,
                                    rgba(255,255,255,.34) 32%,rgba(255,255,255,0) 50%);
}
body.dark .dname{
  font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
  font-weight:400;letter-spacing:.1em;color:#f5efe5;text-align:center;margin-top:10px;
  white-space:nowrap;   /* 名前と（50ml）は1行のまま。入らない時は下の仕組みが字を詰める */
}
/* 商品名の右に添える量（50ml）＝控えめに、名前より小さく淡く */
body.dark .dname .u{
  font-size:.56em;letter-spacing:.04em;color:#cfc0a4;margin-left:.5em;
}
body.dark .dsub{
  /* 量（50ml など）は白（2026-09-03 まるちゃん） */
  font-family:"EB Garamond",serif;font-style:italic;color:#f5efe5;
  text-align:center;margin-top:8px;letter-spacing:.06em;
}
/* 説明と購入ボタンの間の読みものリンク（金の細い下線・押せると分かる形） */
body.dark .dsecret{text-align:center;margin-top:16px}
body.dark .dsecret a{
  display:inline-block;color:#e8d3a6;text-decoration:none;
  font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;
  font-size:15px;letter-spacing:.14em;padding-bottom:4px;
  border-bottom:1px solid rgba(232,211,166,.6);
}
body.dark .dsecret a:active{color:#fff4e0;border-bottom-color:#f0e6d6}
body.dark .dsecret a .ar{margin-left:8px;font-family:inherit}
/* 飛び先がまだ無い読みもの（2026-09-07 まるちゃん）＝押せないと分かる控えめな見た目 */
body.dark .dsecret a.soon{color:#9d9182;border-bottom-color:rgba(157,145,130,.5);cursor:default}
body.dark .dsecret a.soon .soonmk{margin-left:8px;font-size:.72em;letter-spacing:.1em;color:#8e8172}
/* 左に通常の値段（線を引いた小さい字）、右に実際に払う値段。近づけて並べる */
body.dark .dprice{justify-content:center;align-items:flex-end;margin-top:22px;gap:14px}
body.dark .dprice .pc{align-items:center}
body.dark .dprice .was{font-size:15px;margin-bottom:.3em;white-space:nowrap}
body.dark .dprice .lb{color:#c9ab73}
/* ★消してある値段の側にも一言（「日本価格」など）を出す時の見た目（2026-09-06 まるちゃん）。
   右の当店価格より控えめにして、目が先に当店価格へ行くようにする。 */
body.dark .dprice .wasbox{gap:4px}
body.dark .dprice .wasbox .lb{font-size:11px;letter-spacing:.14em;color:#a3937a}
body.dark .dprice .wasbox .was{margin-bottom:0}
body.dark .dprice .now{
  font-family:"EB Garamond",serif;font-weight:500;color:#f0e6d6;letter-spacing:.04em;
}
body.dark .dprice .was{
  font-family:"EB Garamond",serif;color:#9d9182;letter-spacing:.03em;
}
/* ★大きさを選ぶボタン（2026-09-03）。選んでいる方は金色で塗る */
body.dark .dsizes{display:flex;flex-direction:column;gap:8px;margin-top:14px}
body.dark .dsizes button{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:11px 14px;cursor:pointer;
  background:none;border:1px solid rgba(201,171,115,.5);border-radius:2px;
  color:#e8dccb;font-family:inherit;font-size:14px;letter-spacing:.04em;
}
body.dark .dsizes button .p{font-family:"EB Garamond",serif;font-style:italic;font-size:20px;color:#f0e6d6;line-height:1;white-space:nowrap}
/* ★棒の右半分＝日本価格（線を引いた小さい字）と当店価格（大きい字）を横に並べる
   （2026-09-06 まるちゃん「棒の中に全部入れる」）。上に小さな見出しを添える。 */
body.dark .dsizes button .pp{display:flex;align-items:flex-end;gap:12px}
body.dark .dsizes button .w,
body.dark .dsizes button .c{display:flex;flex-direction:column;align-items:center;gap:3px}
body.dark .dsizes button .lb{
  font-size:9.5px;letter-spacing:.14em;font-weight:700;line-height:1;white-space:nowrap;color:#a3937a;
}
body.dark .dsizes button .c .lb{color:#c9ab73}
body.dark .dsizes button .was{
  font-family:"EB Garamond",serif;font-style:italic;font-size:14px;line-height:1;
  color:#9d9182;text-decoration:line-through;white-space:nowrap;
}
body.dark .dsizes button .n{font-size:15px;letter-spacing:.06em;white-space:nowrap}
body.dark .dsizes button.on{
  background:linear-gradient(180deg,#e8d3a6,#c9ab73);border-color:#e8d3a6;color:#25201a;font-weight:600;
}
body.dark .dsizes button.on .p{color:#25201a;font-style:normal;font-weight:700}
body.dark .dsizes button.on .lb{color:#5c4a2a}
body.dark .dsizes button.on .was{color:#6b5a3c}
body.dark #stepItem.tight .dsizes{margin-top:10px;gap:6px}
body.dark #stepItem.tight .dsizes button{padding:8px 12px;font-size:13px}
body.dark #stepItem.tight .dsizes button .p{font-size:18px}
body.dark #stepItem.tight .dsizes button .n{font-size:14px}
body.dark .dtags{justify-content:center}
body.dark .dbody{
  background:none;border:none;border-top:1px solid rgba(201,171,115,.28);
  border-radius:0;color:#c8bdae;padding:22px 2px 0;margin-top:26px;text-align:center;
}
/* ★成分などの箇条書き（2026-09-06 まるちゃん）。見出しは金色、番号は左に立て、
   成分名を明るく、説明は少し落として読みやすくする。 */
body.dark .dbody.haslist{white-space:normal;text-align:left}
/* 長い説明は左そろえ（2026-09-07 まるちゃん。中央そろえだと行の頭がガタつく） */
body.dark .dbody.bodyleft{text-align:left}
body.dark .dbody .sttl{
  text-align:center;color:#c9ab73;font-size:13px;font-weight:700;
  letter-spacing:.2em;margin-bottom:12px;
}
/* 4行をひとかたまりにして、そのかたまりを横の真ん中に置く（①〜④の頭はそろったまま） */
body.dark .dbody .slist{width:max-content;max-width:100%;margin:0 auto}
body.dark .dbody .srow{display:flex;gap:6px;align-items:flex-start;line-height:1.65}
body.dark .dbody .srow+.srow{margin-top:9px}
body.dark .dbody .sno{flex:0 0 auto;color:#c9ab73;font-size:13px;line-height:1.65}
body.dark .dbody .stx{min-width:0;font-size:13px;white-space:nowrap}
body.dark .dbody .stx b{color:#f0e6d6;font-weight:600}
body.dark .dbody .stx .sd{color:#b4a795;display:inline}
body.dark .dbody .stx .sd::before{content:'：';color:#8e8172}
body.dark .dbody .stx .sd.plain::before{content:''}
/* 小見出し（セットの中で商品を分けて見せる時に出る・2026-09-06） */
body.dark .dbody .shd{color:#c9ab73;font-weight:700;letter-spacing:.1em;margin:10px 0 5px}
body.dark .dbody .shd:first-child{margin-top:0}
body.dark #stepItem.tight .dbody .sttl{font-size:12px;margin-bottom:8px}
body.dark #stepItem.tight .dbody .srow+.srow{margin-top:6px}
body.dark #stepItem.tight .dbody .srow{line-height:1.55}
body.dark .note{
  background:none;border:1px solid rgba(201,171,115,.3);border-radius:2px;
  color:#bda98a;
}
/* ★押して先へ進むボタンは全部「金の面」でそろえる（2026-09-02 まるちゃん）。
   細い線だけだと押せると分からないため。角は立てたまま・文字を広げて高級感は保つ。
   ※「前へ戻る」と「お支払い方法の3つ（選ぶだけ）」は、押すボタンと見分けが付くよう細い線のまま。 */
body.dark .buy{
  background:linear-gradient(180deg,#e2caa0 0%,#cdad74 48%,#b7915a 100%);
  border:1px solid rgba(255,246,228,.5);
  color:#0f333d;font-weight:700;letter-spacing:.12em;font-size:16px;
  border-radius:2px;padding:21px 18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 12px 28px rgba(0,0,0,.3);
}
body.dark .buy:active{
  background:linear-gradient(180deg,#cdad74,#a5814a);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 4px 12px rgba(0,0,0,.3);
  transform:translateY(1px);
}
/* 小さい添え書きは、金の面の上なので濃い色にする */
body.dark .buy .s{
  color:#26454e;opacity:.92;font-weight:600;
  letter-spacing:.02em;font-size:11.5px;margin-top:5px;
}
/* 「お支払い方法をお選びください」も、受け取り方法の見出しと同じ大きさにそろえる（2026-09-02 まるちゃん） */
body.dark .pays .ttl{color:#c9ab73;font-size:15px;letter-spacing:.22em}
body.dark .pays .row{margin-top:14px}

/* ── 本数をえらぶ画面（2026-09-02 まるちゃん） ───────────── */
body.dark .qtybox{
  display:flex;align-items:center;justify-content:center;gap:22px;margin:6px 0 4px;
}
body.dark .qbtn{
  width:62px;height:62px;border-radius:2px;cursor:pointer;
  background:none;border:1px solid rgba(201,171,115,.55);color:#e8d3a6;
  font-family:inherit;font-size:26px;line-height:1;font-weight:400;
}
body.dark .qbtn:active{background:rgba(201,171,115,.16)}
body.dark .qbtn[disabled]{opacity:.3}
body.dark .qnum{
  min-width:104px;text-align:center;color:#f5efe5;
  font-family:"EB Garamond",serif;font-size:44px;font-weight:500;line-height:1;
}
body.dark .qnum .qunit{
  font-family:"Shippori Mincho",serif;font-size:16px;margin-left:6px;color:#c9ab73;
}
body.dark .qsum{
  margin:22px 0 0;padding:16px 0 0;border-top:1px solid rgba(201,171,115,.28);
  text-align:center;
}
body.dark .qsum .ql{font-size:12px;letter-spacing:.24em;color:#c9ab73;font-weight:700}
body.dark .qsum .qv{
  font-family:"EB Garamond",serif;font-size:34px;font-weight:500;color:#f0e6d6;
  letter-spacing:.04em;margin-top:6px;
}
/* ★縦の短い機種で「お支払いへ進む」まで1画面に収める（2026-09-06 まるちゃん）。
   下の fitQty が、はみ出した時だけ qtight／qtighter を付ける（付かない機種は今までどおり）。 */
body.dark #viewItem.qtight .stepttl{margin-bottom:10px}
body.dark #viewItem.qtight .qbtn{width:54px;height:54px;font-size:23px}
body.dark #viewItem.qtight .qnum{font-size:36px;min-width:92px}
body.dark #viewItem.qtight .qsum{margin-top:14px;padding-top:11px}
body.dark #viewItem.qtight .qsum .qv{font-size:28px;margin-top:4px}
body.dark #viewItem.qtight #stepQty .buy{padding:18px 14px}
body.dark #viewItem.qtight #stepQty .buy .t{font-size:19px}
body.dark #viewItem.qtight #stepQty .buy.keep{padding:14px 12px}
body.dark #viewItem.qtight #stepQty .buy.keep .t{font-size:15px}
body.dark #viewItem.qtight .buys{margin-top:12px;gap:10px}
body.dark #viewItem.qtight .stephead{margin-top:8px;padding-bottom:10px}

body.dark #viewItem.qtighter .stepttl{margin-bottom:6px;font-size:13px}
body.dark #viewItem.qtighter .qbtn{width:46px;height:46px;font-size:20px}
body.dark #viewItem.qtighter .qnum{font-size:30px;min-width:80px}

function Z(t){
  if (!isZH()) return t;
  var v = ZH[String(t).trim()];
  return (v === undefined) ? t : v;
}
/* 「◯◯ を購入する」だけは語順が変わるので、ここで作る */

/* 本数の言い方 */
/* 数え方。ふつうは「本」、セット商品は「セット」（2026-09-06 まるちゃん） */
function honLabel(n, w){ w = w || '本'; return isZH() ? (n + Z(w)) : (n + w); }

/* ★画面に出た文字を見張って、対応表にある文をその場で中国語にする。
   こうすると、あとから作られる画面（商品・カート・ご注文の確認）も自動でそろう。 */
(function(){
  if (!isZH()) return;
  function swapIn(node){
    if (node.nodeType === 3){
      var k = node.data.trim();
      if (k && ZH[k] !== undefined && ZH[k] !== node.data) node.data = node.data.replace(k, ZH[k]);
      return;
    }
    if (node.nodeType !== 1) return;
    if (node.tagName === 'SCRIPT' || node.tagName === 'STYLE') return;
    for (var i = 0; i < node.childNodes.length; i++) swapIn(node.childNodes[i]);
  }
  window.__swapZH = swapIn;
  /* ★まず、はじめから画面に書いてある分をぜんぶ置き換える（見張りは"あとから増えた分"しか見ないため） */
  function first(){ try{ swapIn(document.body); }catch(e){} }
  if (document.body) first();
  else document.addEventListener('DOMContentLoaded', first);
  try{
    new MutationObserver(function(ms){
      for (var i = 0; i < ms.length; i++){
        var m = ms[i];
        for (var j = 0; j < m.addedNodes.length; j++) swapIn(m.addedNodes[j]);
        if (m.type === 'characterData') swapIn(m.target);
      }
    }).observe(document.documentElement, {childList:true, subtree:true, characterData:true});
  }catch(e){}
})();

    /* 2段階で出す字幕（「それが」→ 商品名） */
    inner += '<div class="cap"><div class="in">' +
               '<div class="ja ja4">' +
                 '<span class="nb p1">' + esc(h.jaA) + '</span>' +
                 '<span class="nb p2">' + esc(h.jaB) + '</span>' +
               (h.jaC ? '<span class="nb p4">' + esc(h.jaC) + '</span>' : '') +
               (h.jaD ? '<span class="side">' +
                          '<span class="nb p5">' + esc(h.jaD) + '</span>' +
                          (h.jaE ? '<span class="nb p6">' + esc(h.jaE) + '</span>' : '') +
                        '</span>' : '') +
               '</div>' +
               (h.en ? '<div class="en p3"><span class="nb">' + esc(h.en) + '</span></div>' : '') +
             '</div></div>';
  } else if (h.ja) {
    inner += '<div class="cap"><div class="in stepped">' +
               /* 日本語は、まるちゃんが決めた所で必ず改行する（画面の広さで勝手につながない）。
                  さらに1行ずつ順番に浮かび上がらせる */
               '<div class="ja">' + chunks(h.ja, true, false, true) + '</div>' +
               '<div class="en">' + chunks(h.en, h.enAlways2, true) + '</div>' +
             '</div></div>';
  }
  s.innerHTML = inner;
  heroEl.insertBefore(s, dotsEl);
  slides.push(s);

  var d = document.createElement('span');
  d.className = 'dot' + (i === 0 ? ' on' : '');
  dotsEl.appendChild(d);
  dots.push(d);
});

/* 表紙の写真＝画面の広さで、スマホ用（正方形）とパソコン用（横長）を出し分ける */
/* ★映像の絵を「もう取り終わった物」だけ覚えておく（2026-09-07）。
   絵を別ファイルにすると、7枚ぶんを一度に貼った瞬間にスマホが7枚を同時に取りに行き、
   回線を7等分してしまう＝1枚目がいつまでも出ない。そこで下の「順番に取る係」が
   1枚取り終わるたびにここへ印を付け、その絵だけを貼る。＝いつも使う順に届く。
   ページの中に埋め込んだ絵（data:）と、下書きの差し込み口はこの仕組みを通らない。 */
var HERO_READY = {};
function paint(el, img){
  if (!hasPic(img)) return;
  if (img.indexOf('data:') !== 0 && !HERO_READY[img]) return;
  el.style.backgroundImage = 'url("'+img+'")';
  el.style.backgroundSize = 'cover';
  el.style.backgroundRepeat = 'no-repeat';
  el.style.backgroundPosition = '50% 50%';
}

function applyHero(){
  /* ★「映像だけ」の版は、画面が広くても必ず正方形（スマホ用）の写真を使う。
     大きな四角で見せるための版なので、横長の写真に切り替わってはいけない（2026-09-02 まるちゃん）。 */
  var wide = (window.__FILM_ONLY__ === true)
           ? false
           : window.matchMedia('(min-width:780px)').matches;
  HEROS.forEach(function(h, i){
    if (h.seq) {
      var ls = slides[i].querySelectorAll('.layer');
      h.seq.forEach(function(g, k){
        if (!ls[k]) return;
        paint(ls[k], wide ? g.pc : g.sp);
        var pos = wide ? g.posPc : g.posSp;
        if (pos) {
          ls[k].style.backgroundSize = '108% auto';   /* ずらす余裕をつくる */
          ls[k].style.backgroundPosition = pos;
        }
      });
    } else {
      paint(slides[i], wide ? h.pc : h.sp);
    }
  });
}
/* かたまりが画面からはみ出しそうな時だけ、字をほんの少し小さくして必ず収める
   （切れ目を守ったまま、その画面で出せる一番大きい字にする） */
/* ★★スマホの「文字を大きくする」設定への対応（2026-09-02・これが字が欠けた真の原因）★★
   まるちゃんの端末（横411）は、こちらが 16px と書いても実際には 20.8px で描かれる＝1.3倍。
   前の作りは「今の大きさ×(入る幅÷実際の幅)」をそのまま書いていたので、書いた値がまた1.3倍され、
   詰めたつもりが逆に大きくなっていた（何度やり直しても直らない）。
   → 倍率を先に測り、書く時は倍率で割る。さらに実際に測り直して、収まるまでくり返す。 */
var _boost = null, _boostFor = -1;
function fontBoost(){
  if (_boost !== null && _boostFor === window.innerWidth) return _boost;
  var k = 1;
  try{
    var p = document.createElement('span');
    p.style.cssText = 'position:absolute;left:-9999px;top:0;font-size:16px;line-height:1;white-space:nowrap';
    p.textContent = 'あいうえお';
    document.body.appendChild(p);
    var got = parseFloat(getComputedStyle(p).fontSize);
    p.parentNode.removeChild(p);
    if (got > 0) k = got / 16;
  }catch(e){}
  if (!(k > 0.5 && k < 4)) k = 1;
  _boost = k; _boostFor = window.innerWidth;
  return k;
}
/* 「描かれる大きさ」を指定して書く（端末の倍率で割ってから書く） */
function setFontPx(el, shown){
  el.style.fontSize = (Math.floor((shown / fontBoost()) * 100) / 100) + 'px';
}
/* 「字そのものの幅」を測る。
   ★入れ物いっぱいに広がる書き方（block）の物は、入れ物の幅を返してしまうので、
     中の字だけを測る（そうしないと、短い字なのに小さくされてしまう）。 */
function textWidth(el){
  var w = 0;
  try{
    var rg = document.createRange();
    rg.selectNodeContents(el);
    w = rg.getBoundingClientRect().width;
  }catch(e){}
  /* 本当にはみ出している時は、はみ出した分の幅も見る */
  if (el.scrollWidth > el.clientWidth + 1) w = Math.max(w, el.scrollWidth);
  if (!(w > 0)) w = el.getBoundingClientRect().width;
  return w;
}

/* 決めた幅に収まるまで、実際に測りながら字を詰める */
function shrinkToFit(el, room){
  if (!el || !(room > 0)) return;
  el.style.fontSize = '';
  for (var i = 0; i < 3; i++){
    var w = textWidth(el);
    if (!(w > room)) return;
    var now = parseFloat(getComputedStyle(el).fontSize);
    if (!(now > 0)) return;
    setFontPx(el, Math.max(6, now * (room / w) * 0.98));
  }
}

function fitCaps(){
  slides.forEach(function(s){
    var cap = s.querySelector('.cap');
    var box = s.querySelector('.in');
    if (!cap || !box) return;
    /* 入る幅は帯そのものから計算する（文字の入れ物の幅を当てにしない）。
       9%の余裕を持たせて、機種による字の太さの違いでもはみ出さないようにする。 */
    var room = Math.min(cap.clientWidth - 20, 760) * 0.93;
    if (!(room > 0)) return;
    ['.ja', '.en'].forEach(function(sel){
      var el = s.querySelector(sel);
      if (!el) return;
      el.style.fontSize = '';                     /* いったん元の大きさに戻す */
      /* 動きの拡大を含めない実際の幅で測る（含めると必要以上に小さくなる）。
         収まるまでくり返す＝端末が字を大きくする設定でも必ず収まる。 */
      for (var i = 0; i < 3; i++){
        var widest = 0;
        el.querySelectorAll('.nb').forEach(function(n){
          var w = Math.max(n.scrollWidth, n.offsetWidth, n.getBoundingClientRect().width);
          if (w > widest) widest = w;
        });
        if (!(widest > room)) break;
        var now = parseFloat(getComputedStyle(el).fontSize);
        if (!(now > 0)) break;
        /* 2%だけ余裕を持たせて、ぎりぎりで欠けないようにする */
        setFontPx(el, Math.max(6, now * (room / widest) * 0.98));
      }
    });
  });

  /* ★写真4枚（クジラ〜サボテン）の日本語は、全部同じ大きさにそろえる
     （行の長さで大きさが変わると読みにくい＝2026-09-02 まるちゃん）。
     いちばん詰まった1枚に合わせる。そうしないと、どれかが画面からはみ出す。
     ふつうは「そして、３０年にもわたり…」の1枚が一番長いので、その大きさになる。 */
  var jas = [];
  for (var i = 0; i < 4 && i < slides.length; i++){
    var one = slides[i] && slides[i].querySelector('.ja');
    if (one) jas.push(one);
  }
  if (jas.length > 1){
    var small = Math.min.apply(null, jas.map(function(e){
      return parseFloat(getComputedStyle(e).fontSize);
    }));
    if (small > 0) jas.forEach(function(e){ setFontPx(e, small); });
  }
}

/* 冒頭の白い画面の言葉も、はみ出しそうなら同じように詰める */
function fitIntro(){
  var intro = document.getElementById('intro');
  if (!intro) return;
  var box = intro.querySelector('.grp');
  if (!box) return;
  var room = (box.clientWidth - 44) * 0.96;
  if (room <= 0) return;
  intro.querySelectorAll('.ln').forEach(function(el){ shrinkToFit(el, room); });

  /* ★はじめの3行（お手持ちの…／最大限に引き出し／あなたのお肌を…）は同じ大きさにそろえる
     （2026-09-02 まるちゃん）。いちばん詰まった行に合わせる。 */
  var three = ['.l1', '.l2', '.l2b'].map(function(s){ return intro.querySelector(s); })
                                    .filter(function(e){ return !!e; });
  if (three.length > 1){
    var small = Math.min.apply(null, three.map(function(e){
      return parseFloat(getComputedStyle(e).fontSize);
    }));
    if (small > 0) three.forEach(function(e){ setFontPx(e, small); });
  }
}

/* 2つの大きなボタンの文字も、はみ出しそうなら詰めて必ず収める */
function fitCards(){
  document.querySelectorAll('.gcard').forEach(function(g){
    var box = g.querySelector('.in');
    if (!box) return;
    var room = (box.clientWidth - 24) * 0.95;   /* 左右の余白ぶん＋機種差の余裕 */
    if (room <= 0) return;
    /* ★はみ出して切られている時は、見えている幅ではなく中身の幅で測る */
    ['.jp', '.en', '.ds'].forEach(function(sel){ shrinkToFit(g.querySelector(sel), room); });
  });

  /* 2つのボタンで字の大きさをそろえる（片方だけ詰まって見えないように） */
  ['.jp', '.en', '.ds'].forEach(function(sel){
    var els = [].slice.call(document.querySelectorAll('.gcard ' + sel));
    if (els.length < 2) return;
    var min = Math.min.apply(null, els.map(function(e){
      return parseFloat(getComputedStyle(e).fontSize);
    }));
    els.forEach(function(e){ setFontPx(e, min); });
  });
}

/* 字の書き出しの高さをそろえる。
   基準は「それは、1970年代」の画面（1枚目）。もともとの まん中ぞろえ だった時に
   その1行目があった高さ＝(帯の高さ − 1枚目の字のかたまりの高さ)÷2 を計算して、
   5枚とも・冒頭の白い光の画面とも、その高さから書き始める。
   ※画面の広さで帯の高さも字の大きさも変わるので、決め打ちの割合ではなく毎回測って出す。 */
function alignTextTop(){
  var base = slides[0] && slides[0].querySelector('.cap .in');
  if (!heroEl || !base) return;
  var hh = heroEl.getBoundingClientRect().height;
  if (!hh) return;
  /* まず全部を等倍に戻してから、素の高さを測る */
  var ins = [];
  document.querySelectorAll('.cap .in').forEach(function(el){
    el.style.setProperty('--cap-scale', '1');
    ins.push(el);
  });
  var bh = base.getBoundingClientRect().height;
  if (!bh) return;
  var top = Math.max(0, Math.round((hh - bh) / 2));
  document.querySelectorAll('.slide, .intro').forEach(function(el){
    el.style.setProperty('--text-top', top + 'px');
  });
  /* 行数の多い画面が帯の下からはみ出す時だけ、その画面の字を少しだけ小さくする
     （書き出しの高さは動かさない＝5枚とも同じ高さのまま） */
  var room = hh - top - 6;
  ins.forEach(function(el){
    var h = el.getBoundingClientRect().height;
    var k = (room > 0 && h > room) ? Math.max(0.6, room / h) : 1;
    el.style.setProperty('--cap-scale', k.toFixed(3));
  });
}

/* 映画の題名の2行を、それぞれ必ず1行に収める（はみ出しそうなら少しだけ小さくする） */
function fitTitle(){
  if (!titleEl) return;
  /* ★ここは1行がとても長いので、余裕を一番きつくしていた（1.5%）のが原因で
     実機（字が少し太い）だと端が欠けた。他と同じ「9%の余裕」にそろえる。 */
  var room = (titleEl.clientWidth - 16) * 0.95;
  if (room <= 0) return;
  ['.ten', '.tja'].forEach(function(sel){ shrinkToFit(titleEl.querySelector(sel), room); });
}

/* 押すボタンの字も、はみ出しそうなら詰めて必ず1行に収める
   （帯の字幕・入口の2枚と同じやり方。スマホの字は機種で太さが違うので、ここでも余裕を持たせる） */
function fitBuys(){
  document.querySelectorAll('.buy').forEach(function(b){
    var room = (b.clientWidth - 36) * 0.93;   /* 左右の余白ぶん＋機種差の余裕 */
    if (!(room > 0)) return;                  /* 隠れている時は測れないので何もしない */
    ['.t', '.s'].forEach(function(sel){ shrinkToFit(b.querySelector(sel), room); });
  });
}

/* ★本数をえらぶ画面も1画面に収める（2026-09-06 まるちゃん）。
   はみ出している時だけ、詰めた見た目に切り替える（2段階）。機種や文字の大きさを問わず効く。 */
function fitQty(){
  var v = document.getElementById('viewItem');
  if (!v || payStep !== 2) { if (v) v.classList.remove('qtight', 'qtighter'); return; }
  v.classList.remove('qtight', 'qtighter');
  function over(){
    return document.documentElement.scrollHeight - window.innerHeight;
  }
  if (over() > 0) v.classList.add('qtight');
  if (over() > 0) v.classList.add('qtighter');
}

/* ★ご注文内容のご確認も同じやり方で1画面に収める（2026-09-06 まるちゃん）。
   ここは上の商品の写真と名前を出さないぶん背が低いが、機種によっては
   まだはみ出すので、はみ出した時だけ2段階で詰める。 */
function fitConfirm(){
  var v = document.getElementById('viewItem');
  var box = document.getElementById('oLines');
  if (!v || payStep !== 4) { if (v) v.classList.remove('ctight', 'ctighter'); return; }
  v.classList.remove('ctight', 'ctighter');
  if (box) box.style.maxHeight = '';
  function over(){
    return document.documentElement.scrollHeight - window.innerHeight;
  }
  if (over() > 0) v.classList.add('ctight');
  if (over() > 0) v.classList.add('ctighter');
  /* それでも入りきらない＝たくさん買われた時。商品の行の枠だけを縮めて、
     合計・①②③・注文ボタンは必ず画面に残す（枠の中は指でずらして見られる） */
  var n = over();
  if (n > 0 && box){
    var h = box.offsetHeight - n - 2;         /* -2＝端数の切り上げで1つぶんはみ出すのを防ぐ */
    if (h < 64) h = 64;                       /* 2行ぶんくらいは必ず見えるようにする */
    box.style.maxHeight = h + 'px';
  }
}

/* ★成分の並びは「1行につき必ず1行」（2026-09-06 まるちゃん）。
   4本とも同じ大きさのまま、いちばん長い行が横幅に収まるところまで字を詰める。
   幅を測って決めるので、機種や文字の大きさの設定を問わず折り返さない。 */
/* ★大きさの棒＝右の値段は折り返さない。名前が長い時は名前の字だけ詰めて1行に収める
   （2026-09-06 まるちゃん。「Aセット（ソープ130ml + オイル）」で値段が2行になった） */
/* ★一覧の商品名は必ず1行（2026-09-06 まるちゃん）。入らない時はその場で字を詰める。 */
function fitTiles(){
  [].slice.call(document.querySelectorAll('#viewList .item')).forEach(function(b){
    var n = b.querySelector('.nm');
    if (!n || b.offsetParent === null) return;
    n.style.fontSize = '';
    var room = (b.clientWidth - 20) * 0.98;
    if (!(room > 0)) return;
    shrinkToFit(n, room);
    /* ★名前は小さくしすぎない（2026-09-07 まるちゃん「上は商品名だから大きい字」） */
    var np = parseFloat(getComputedStyle(n).fontSize);
    if (!(np > 0)) np = 15;
    if (np < 13.5){ np = 13.5; setFontPx(n, np); }
    /* ★副題は必ず名前の4分の3の大きさにする（2026-09-07 まるちゃん「副題本当に小さい？」）。
       名前が詰められた時も、決まった割合で一緒に小さくなるので、必ず差が付く。 */
    var sub = b.querySelector('.sub');
    if (sub) setFontPx(sub, Math.max(9.5, np * 0.75));
  });
}

function fitSizes(){
  var box = document.getElementById('dsizes');
  if (!box || box.style.display === 'none' || box.offsetParent === null) return;
  [].slice.call(box.querySelectorAll('button')).forEach(function(b){
    var n = b.querySelector('.n'), pp = b.querySelector('.pp');
    if (!n || !pp) return;
    n.style.fontSize = '';
    var pad = 30;                                  /* 棒の左右の余白ぶん */
    for (var k = 0; k < 4; k++){
      var room = b.clientWidth - pp.getBoundingClientRect().width - pad;
      var w = textWidth(n);
      if (!(w > room) || !(room > 0)) break;
      var now = parseFloat(getComputedStyle(n).fontSize);
      if (!(now > 0)) break;
      setFontPx(n, Math.max(9, now * (room / w) * 0.97));
    }
  });
}

function fitSpec(){
  var db = document.getElementById('dbody');
  if (!db || !db.classList.contains('haslist') || db.offsetParent === null) return;
  var rows = [].slice.call(db.querySelectorAll('.srow'));
  var hds  = [].slice.call(db.querySelectorAll('.shd'));
  var room = db.clientWidth - 2;
  if (!rows.length || !(room > 0)) return;
  function put(px){
    rows.forEach(function(r){
      setFontPx(r.querySelector('.sno'), px);
      setFontPx(r.querySelector('.stx'), px);
    });
    hds.forEach(function(h){ setFontPx(h, Math.max(9, px * 0.94)); });
  }
  function widest(){
    var w = 0;
    rows.forEach(function(r){
      var no = r.querySelector('.sno'), tx = r.querySelector('.stx');
      w = Math.max(w, no.getBoundingClientRect().width + textWidth(tx) + 7);
    });
    hds.forEach(function(h){ w = Math.max(w, textWidth(h) + 7);
    });
    return w;
  }
  var f = 13.5;
  put(f);
  for (var k = 0; k < 5; k++){
    var w = widest();
    if (!(w > room)) break;
    f = Math.max(7, f * (room / w) * 0.985);
    put(f);
  }
}

/* ★商品の詳しい画面は「◯◯を購入する」までが1画面に収まるようにする（2026-09-02 まるちゃん）。
   写真の高さを、残りの場所に合わせて決める＝測って決めるので機種や文字の大きさを問わない。 */
function fitItem(){
  var pane = document.getElementById('stepItem');
  var hero = document.getElementById('dhero');
  if (!pane || !hero) return;
  if (pane.offsetParent === null) return;          /* 出ていない時は何もしない */
  /* 成分の並びを先に1行ずつに収める＝この高さが決まらないと写真の大きさを決められない */
  try { fitSpec(); } catch(e){}
  try { fitSizes(); } catch(e){}
  hero.style.height = '';
  hero.style.width  = '';
  pane.classList.remove('tight');
  function room(){
    var paneTop = pane.getBoundingClientRect().top + (window.scrollY || 0);
    var others  = pane.getBoundingClientRect().height - hero.getBoundingClientRect().height;
    return window.innerHeight - paneTop - others - 22;   /* 下の余白ぶん（少し多めに残す） */
  }
  var r = room();
  /* 場所が足りない画面では、文字まわりの間をさらに詰めてから写真の高さを決める */
  if (r < 175){ pane.classList.add('tight'); r = room(); }
  /* 写真は正方形。1辺は「残りの高さ」と「横幅の3分の2」の小さい方 */
  var paneW = (pane.getBoundingClientRect().width || window.innerWidth);
  /* ★2枚並びの時は横長（2枚ぶん）＝高さは幅の半分（2026-09-07 まるちゃん） */
  if (hero.classList.contains('two')){
    var w2 = Math.min(paneW, r * 2);
    if (w2 < 160) w2 = 160;
    w2 = Math.floor(w2);
    hero.style.width  = w2 + 'px';
    hero.style.height = Math.floor(w2 / 2) + 'px';
  } else {
    var maxW = paneW * 0.667;
    var side = Math.min(r, maxW);
    if (side < 96) side = 96;                      /* これ以下には小さくしない */
    side = Math.floor(side);
    hero.style.height = side + 'px';
    hero.style.width  = side + 'px';
  }

  /* 商品名（＋その右の量）も、1行のまま画面に収める */
  var dn = document.getElementById('dname');
  if (dn && dn.offsetParent !== null) shrinkToFit(dn, (dn.clientWidth - 6) * 0.95);

  /* 写真の中に重ねた一言。写真の大きさに合わせて字を決め、
     瓶に掛からないよう左半分に収める（4行そろって同じ大きさ） */
  var lead = document.getElementById('dlead');
  if (lead && lead.offsetParent !== null){
    var ls = [].slice.call(lead.querySelectorAll('span'));
    if (ls.length){

      var akaru = document.getElementById('dhero').classList.contains('leadLight');
      var base = Math.max(8, side * (akaru ? 0.078 : 0.049));
      ls.forEach(function(s){ setFontPx(s, base); });
      var lroom = side * (akaru ? 0.90 : 0.50);
      for (var k = 0; k < 3; k++){
        var widest = 0;
        ls.forEach(function(s){ widest = Math.max(widest, textWidth(s)); });
        if (!(widest > lroom)) break;
        var now = parseFloat(getComputedStyle(ls[0]).fontSize);

        var next = Math.max(8, now * (lroom / widest) * 0.98);
        ls.forEach(function(s){ setFontPx(s, next); });
      }
    }
  }
}

/* ═══ 絵を「使う順」に1枚ずつ取りに行く係（2026-09-07 まるちゃん「4Gで重くないか」） ═══
   ★なぜ要るか
     絵をページの中に埋め込むのをやめて別ファイルにした（＝スマホはスマホ用の絵だけ、
     商品の写真は見る時だけ取る）。ただし別ファイルにすると、貼った瞬間に全部を
     いっせいに取りに行き、細い回線を全員で分け合って「どれも遅い」状態になる。
     そこで、この係が1枚ずつ順番に取り、取れた物からその場に貼っていく。
     ＝1枚目がいちばん早く届く＝映像が黒いまま始まらない。
   ★取る順番
     ①瓶の写真（開いて0.3秒で要る）→ 上の startShow が直に取りに行く
     ②映像の絵を出る順に7枚（スマホならスマホ用だけ・パソコンならパソコン用だけ）
     ③商品の写真（映像が終わってお店に入ってから要る＝いちばん最後） */
function loadInOrder(list, done){
  var i = 0;
  (function next(){
    if (i >= list.length){ if (done) { try{ done(); }catch(e){} } return; }
    var one = list[i++];
    var url = one && one.url;
    if (!hasPic(url) || url.indexOf('data:') === 0){    /* 埋め込みの絵は取りに行く必要が無い */
      if (one && one.after) { try{ one.after(); }catch(e){} }
      next(); return;
    }
    if (HERO_READY[url]) { if (one.after) { try{ one.after(); }catch(e){} } next(); return; }
    var im = new Image();
    im.onload = im.onerror = function(){
      HERO_READY[url] = true;
      if (one.after) { try{ one.after(); }catch(e){} }
      next();
    };
    im.src = url;
  })();
}

/* 白い光のオープニング → 写真を順に → またオープニング、をずっと繰り返す */
var INTRO_MS = 9360;   /* 最後の言葉が出そろって、灰色に包まれきるまで */
var FLARE_MS = 900;    /* まん中から灰色が広がり、画面全体が写真と同じ色になるまで */
var flareTimer = null;
/* 題名は「打ち終わり → 英語が出そろう → すぐ次の画面」（2026-09-04 まるちゃん）。
   英語が浮かび上がるのに1秒、そのあとほんの一呼吸だけ置いて引く */
var TITLE_EN_MS   = 1000;   /* 英語が出そろうまで */
var TITLE_HOLD_MS = 250;    /* 出そろってからの一呼吸 */
var TITLE_OUT_MS = 800;    /* 題名がそっと消えるまで */
var PHOTO_MS = 4200;   /* 写真1枚あたり（行数で決まらない時の予備） */
var FIRST_MS = 450;    /* 写真が出てから最初のかたまりが浮かぶまで */
var HOLD_MS  = 600;    /* かたまりを出してからの一呼吸 */
var READ_MS  = 550;    /* その1行を読むのにかかるぶん（かたまりの行数ぶん足す） */
var LINGER_MS = 1500;  /* 全部出そろってから次の写真へ移るまでの余韻 */
var PHOTO_MS_MIN = 3000;

/* その写真の字幕を「何秒後に・どのかたまりを出すか」の予定表を作る。
   jaSteps＝いっきに出す行数の並び（例 [1,2]＝1行目→残り2行いっきに→英語） */
function capPlan(k){
  var s = slides[k];
  var box = s && s.querySelector('.cap .in.stepped');
  if (!box) return null;
  var lines = [].slice.call(box.querySelectorAll('.ja .line'));
  if (!lines.length) return null;
  var steps = (HEROS[k] && HEROS[k].jaSteps) || null;
  /* jaPause＝その組を出す「前」に置く、追加の間（ミリ秒）。ためを作りたい行に使う
     jaAfter＝その組を出した「あと」に足す時間＝その組が画面に出ている時間が延びる */
  var pause = (HEROS[k] && HEROS[k].jaPause) || null;
  var after = (HEROS[k] && HEROS[k].jaAfter) || null;
  var plan = [], t = FIRST_MS, i = 0, g = 0;
  while (i < lines.length){
    var n = steps ? (steps[g] || 1) : 1;
    var group = lines.slice(i, i + n);
    if (pause && pause[g]) t += pause[g];
    plan.push({ at: t, els: group });
    /* ★1つ目の字幕から2つ目までの間だけ、1.5倍ゆっくりにする（2026-09-04 まるちゃん） */
    t += (HOLD_MS + group.length * READ_MS) * (g === 0 ? 1.5 : 1);
    if (after && after[g]) t += after[g];
    i += group.length; g++;
  }
  /* 英語が出る時刻。ふだんは日本語が出そろった直後だが、
     enAfter を書いた場面は「最後の日本語が出てから◯ミリ秒後」にする（2026-09-05 まるちゃん） */
  var lastAt = plan.length ? plan[plan.length - 1].at : FIRST_MS;
  var enAt = (HEROS[k] && HEROS[k].enAfter) ? (lastAt + HEROS[k].enAfter) : (t - 300);
  return { plan: plan, enAt: enAt, box: box, en: box.querySelector('.en'),
           total: t + LINGER_MS };
}
var introEl  = document.getElementById('intro');

var labelEl     = document.getElementById('introLabel');
var LABEL_MS    = 4000;   /* ラベルが画面に出ている時間（2026-09-07 まるちゃん「4秒にして」） */

/* ★題名を1文字ずつ打ち出す（映画の題名のように・2026-09-04 まるちゃん）。
   ・字は最初から全部置いておき、見え方だけを順に変える（行が動かない・幅も変わらない
     ので、字の大きさを測って合わせる仕組みもそのまま効く）

var TYPE_MS   = 105;   /* 1文字ぶんの間 */
var typeTimers = [];
var tjaEl = titleEl && titleEl.querySelector('.tja');
function splitTitle(){

var timer    = null;   /* 次の合図はいつも1つだけ（二重に回らないようにする） */

function later(fn, ms){ clearTimeout(timer); timer = setTimeout(fn, ms); }

var seqTimers = [];

/* prep＝「絵を用意するだけ」。冒頭の白い画面の裏で1枚目を先に出す時に使う。
   字幕を出す予定は組まない（組むと、白い画面が引いた時に字がすでに出ていて、
   そのあと本番で組み直すために一度消えてまた出る＝ちらつく） */
function setPhoto(i, prep){
  slides.forEach(function(s, k){ s.classList.toggle('on', k === i); });
  dots.forEach(function(d, k){ d.classList.toggle('on', k === i); });

  /* 色がついていく絵と、2段階の字幕を、いったん最初に戻してから順に出す */
  seqTimers.forEach(clearTimeout);
  seqTimers = [];

  /* 写真の字幕を、決めたかたまりごとに順番に浮かび上がらせる
     （最後の瓶の画面はこれとは別の出し方） */
  slides.forEach(function(s, k){
    var p = capPlan(k);
    if (!p) return;
    p.plan.forEach(function(g){ g.els.forEach(function(x){ x.classList.remove('lit'); }); });
    if (p.en) p.en.classList.remove('lit');
    if (prep || k !== i) return;
    p.plan.forEach(function(g){
      seqTimers.push(setTimeout(function(){
        g.els.forEach(function(x){ x.classList.add('lit'); });
      }, g.at));
    });
    if (p.en) seqTimers.push(setTimeout(function(){ p.en.classList.add('lit'); }, p.enAt));
  });
  slides.forEach(function(s, k){
    var ls = s.querySelectorAll('.layer');
    var parts = s.querySelectorAll('.p1,.p2,.p3,.p4,.p5,.p6');
    if (!ls.length && !parts.length) return;

    var sq = (HEROS[k] && HEROS[k].seq) || [];
    ls.forEach(function(l, n){
      l.classList.toggle('on', n === 0);
      l.classList.remove('drained');            /* 削れた状態も元に戻す */
      l.classList.remove('drain-start');
      /* 中身が減って現れる絵は、じわっと出さず最初から置く（上の絵に隠れている） */
      l.classList.toggle('instant', !!(sq[n] && sq[n].drain));
      /* 重ねる順：中身が減って現れる絵は、そのひとつ上の絵の下に敷く */
      l.style.zIndex = (n === 0) ? 0 : (sq[n] && sq[n].drain ? n - 1 : n + 1);
    });
    parts.forEach(function(p){ p.classList.remove('lit'); });
    if (prep || k !== i) return;

    var step = HEROS[k].stepMs || 3600;
    var seq  = HEROS[k].seq || [];
    for (var n = 1; n < ls.length; n++){
      (function(layer, n){
        var at = (seq[n] && seq[n].at) || step * n;   /* 絵が変わり始める時刻 */
        if (seq[n] && seq[n].drain) {
          /* この1枚は「上から中身が減って現れる」＝自分は先に置いておき、
             ひとつ上に重なっている絵を上のふちから削って見せる */
          var above = ls[n-1];
          seqTimers.push(setTimeout(function(){
            layer.classList.add('on');          /* 下に敷く（まだ上の絵に隠れている） */
            /* まず、削り始めの位置（瓶の口のあたり）へ音もなく置く。
               ここは2枚の写真がまったく同じ絵なので、見た目は1ミリも変わらない */
            above.classList.add('drain-start');
            void above.offsetWidth;
            above.classList.remove('drain-start');
            above.classList.add('drained');     /* ここから液面がゆっくり下りていく */
          }, at));
        } else {
          seqTimers.push(setTimeout(function(){ layer.classList.add('on'); }, at));
        }
      })(ls[n], n);
    }
    var H = HEROS[k];
    var tP1 = H.tP1 || 700, tP2 = H.tP2 || step, tP3 = H.tP3 || (step + 900);
    var tP4 = H.tP4 || (step * 2), gap = H.tGap || 1850;
    var p1 = s.querySelector('.p1'), p2 = s.querySelector('.p2'), p3 = s.querySelector('.p3');
    if (p1) seqTimers.push(setTimeout(function(){ p1.classList.add('lit'); }, tP1));
    if (p2) seqTimers.push(setTimeout(function(){ p2.classList.add('lit'); }, tP2));
    if (p3) seqTimers.push(setTimeout(function(){ p3.classList.add('lit'); }, tP3));
    /* 最後の3行は、まったく同じ間合いで1行ずつ出す */
    var p4 = s.querySelector('.p4'), p5 = s.querySelector('.p5'), p6 = s.querySelector('.p6');
    if (p4) seqTimers.push(setTimeout(function(){ p4.classList.add('lit'); }, tP4));
    if (p5) seqTimers.push(setTimeout(function(){ p5.classList.add('lit'); }, tP4 + gap));
    if (p6) seqTimers.push(setTimeout(function(){ p6.classList.add('lit'); }, tP4 + gap * 2));
  });
}

/* その写真にいる時間＝字が全部出そろうまで＋少しの余韻（予定表から自動で決まる） */
function dwellOf(i){
  if (HEROS[i].ms) return HEROS[i].ms;
  var p = capPlan(i);
  return p ? Math.max(PHOTO_MS_MIN, p.total) : PHOTO_MS;
}

/* ★一番はじめ：まっ白な画面に瓶だけを出してから、いつもの言葉の画面へ入る
   （白い背景の瓶の写真がまだ無い時は、この画面を飛ばして今までどおり始まる） */
var OPEN_MS    = 6600;  /* 瓶だけの画面：出る→4秒かけて減る→少し余韻 */
var DRAIN_AT   = 1200;  /* 減り始めるまで */
var openingEl  = document.getElementById('opening');
var openingIm  = document.getElementById('openingImg');
var openingImB = document.getElementById('openingImgB');

var openTimers = [];

/* first＝ページを開いた一番最初。2回目からは、最後の「あなたの肌へ」のあとに
   またこの瓶の画面へ戻ってくるので、白い画面をふわっと重ねてから出す */
function startShow(first){
  if (!IMG_BOTTLE_WHITE || IMG_BOTTLE_WHITE.charAt(0) === '@') { playIntro(); return; }
  openTimers.forEach(clearTimeout); openTimers = [];
  openingIm.src = IMG_BOTTLE_WHITE;
  if (IMG_BOTTLE_BLUE && IMG_BOTTLE_BLUE.charAt(0) !== '@') openingImB.src = IMG_BOTTLE_BLUE;
  openingEl.classList.remove('off', 'lit', 'drain');
  if (first) {
    openingEl.classList.remove('gone');
  } else {
    openingEl.classList.add('gone');
    void openingEl.offsetWidth;          /* いったん透明にしてから */
    openingEl.classList.remove('gone');  /* ふわっと白い画面に戻る */
  }
  var lead = first ? 250 : 800;

  openTimers.push(setTimeout(function(){ openingEl.classList.add('drain'); }, lead + DRAIN_AT));
  openTimers.push(setTimeout(function(){
    /* ★順番が大事：先に下の白い画面を「じわっとではなく即座に」出しておく。
       そのうえで瓶の画面だけをゆっくり消すので、瓶はふわっと消えるのに、
       あいだに写真が透けて見える（変な絵が混ざる）ことは起きない。 */
    playIntro(true);
    openingEl.classList.add('gone');
    openTimers.push(setTimeout(function(){ openingEl.classList.add('off'); }, 1100));
  }, first ? OPEN_MS : OPEN_MS + 700));
}
