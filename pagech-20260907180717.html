/* ★大きさ（130ml／200ml・Aセット／Bセット）が選べる商品のための小さな部品（2026-09-03）
   ・curSize＝いま選んでいる大きさ ・curPrice()／curWas()／curSizeName()＝その値段と名前 */
var curSize = 0;
function sizeOf(it){ return (it && it.sizes) ? it.sizes[Math.min(curSize, it.sizes.length-1)] : null; }
function curPrice(){ var v = sizeOf(curItem); return v ? v.now : (curItem ? curItem.now : null); }
function curWas(){   var v = sizeOf(curItem); return v ? v.was : (curItem ? curItem.was : null); }
function curSizeName(){ var v = sizeOf(curItem); return v ? v.nm : ''; }
/* カートの中では「同じ商品でも大きさが違えば別の行」にする */
function lineId(it, si){ return it.id + ((it && it.sizes) ? ('#' + si) : ''); }
function lineName(it, si){
  if (!it || !it.sizes) return it ? Z(it.nm) : '';
  var v = Z(it.sizes[si].nm);
  /* 大きさの名前にすでにカッコが入っている時は、カッコを二重にしない */
  return Z(it.nm) + (v.indexOf('（') >= 0 ? ('　' + v) : ('（' + v + '）'));
}

function drawPrice(){
  var it = curItem; if (!it) return;
  var was = curWas(), now = curPrice();
  var pbox = document.getElementById('dprice');
  /* ★大きさが選べる商品は、値段を全部「大きさの棒」の中に入れる（2026-09-06 まるちゃん）。
     こうすると130mlと200ml、両方の日本価格と当店価格が一目で見比べられる。
     上の大きな値段は同じことの二度書きになるので出さない。 */
  if (it.sizes){ pbox.innerHTML = ''; pbox.style.display = 'none'; return; }
  pbox.style.display = '';
  /* ★消してある値段の上にも一言を出せるようにした（2026-09-06 まるちゃん）。
     その商品に lb_was が書いてあれば出す（例＝「日本価格」「単品で買うと」）。無ければ今までどおり値段だけ。 */
  /* was_txt が書いてあれば、その文字をそのまま出す（日本円など「元」を付けない値段用） */
  var wasTxt = it.was_txt ? esc(it.was_txt) : (was!=null ? yen(was) : '');
  pbox.innerHTML =
    (wasTxt
      ? (it.lb_was
          ? '<div class="pc wasbox"><div class="lb">' + esc(it.lb_was) + '</div>'
            + '<div class="was">' + wasTxt + '</div></div>'
          : '<div class="was">' + wasTxt + '</div>')
      : '')
    +
    (now!=null
      ? '<div class="pc"><div class="lb">' + (it.lb_now || '当店価格') + '</div>'
        + '<div class="now">' + yen(now) + '</div></div>'
      : '<div class="pc"><div class="now" style="color:#b4544f;font-size:22px">値段 未定</div></div>');
}

function drawSizes(){
  var it = curItem, box = document.getElementById('dsizes');
  if (!it || !it.sizes){ box.innerHTML = ''; box.style.display = 'none'; return; }
  box.style.display = '';
  /* 棒1本の中身＝［大きさ］［日本価格（線を引いた小さい字）］［当店価格（大きい字）］
     （2026-09-06 まるちゃん「棒の中に全部入れる」）。ここに全部あるので上の値段は出さない。 */
  var lbW = it.lb_was || '日本価格';
  var lbN = it.lb_now || '当店価格';
  box.innerHTML = it.sizes.map(function(v, i){
    return '<button type="button" class="' + (i===curSize?'on':'') + '" data-i="' + i + '">'
         + '<span class="n">' + esc(v.nm) + '</span>'
         + '<span class="pp">'
         + (v.was!=null
             ? '<span class="w"><span class="lb">' + esc(lbW) + '</span>'
               + '<span class="was">' + yen(v.was) + '</span></span>'
             : '')
         + '<span class="c"><span class="lb">' + esc(lbN) + '</span>'
         + '<span class="p">' + yen(v.now) + '</span></span>'
         + '</span></button>';
  }).join('');
  [].slice.call(box.querySelectorAll('button')).forEach(function(b){
    b.onclick = function(){
      curSize = parseInt(b.getAttribute('data-i'), 10) || 0;
      var ci = cartFind(lineId(curItem, curSize));
      qty = (ci >= 0) ? cart[ci].qty : 1;
      drawPrice(); drawSizes(); drawQty(); fitItem();
    };
  });
}

function openItem(cat, id){
  var it = DATA[cat].items.filter(function(x){return x.id===id})[0];
  if(!it) return;

  var dpic = itemPic(it);
  /* ★写真の中に、白い字で一言を重ねる（2026-09-03 まるちゃん）。
     瓶は写真の右寄りにいるので、字は左側に置いて邪魔をしない。 */
  var leadHtml = (it.lead && it.lead.length)
    ? '<div class="dlead" id="dlead">'
      + it.lead.map(function(s){ return '<span>' + esc(s) + '</span>'; }).join('')
      + '</div>'
    : '';
  var dh = document.getElementById('dhero');
  /* ★2枚目の写真がある商品は、詳しい画面だけ横に2枚並べる（2026-09-07 まるちゃん）。
     一覧のマスは今までどおり1枚目だけ。 */
  var dpic2 = (it.pic2 && ITEM_PICS[it.pic2]) ? ITEM_PICS[it.pic2] : '';
  var two = hasPic(dpic) && hasPic(dpic2);
  dh.classList.toggle('two', two);
  dh.innerHTML = (two
    ? '<img src="'+dpic+'" alt=""><img src="'+dpic2+'" alt="">'
    : (hasPic(dpic)
        ? '<img src="'+dpic+'" alt="">'
        : '商品の写真をここに入れます')) + leadHtml;
  dh.classList.toggle('hasLead', !!leadHtml);
  /* 白っぽい写真の商品は、濃い字を写真の上の帯に置く形にする（2026-09-06 まるちゃん） */
  dh.classList.toggle('leadLight', !!(leadHtml && it.leadLight));
  /* 説明と購入ボタンの間の読みものリンク（ある商品だけ出す） */
  var ds = document.getElementById('dsecret');
  /* ★飛び先がまだ決まっていない読みものも、同じ見た目で出す（2026-09-07 まるちゃん）。
     押しても動かず、小さく「準備中」と添える。飛び先を入れた瞬間にふつうのリンクになる。 */
  var sec = it.secret;
  var secUrl = sec ? ((isZH() && sec.url_zh) ? sec.url_zh : sec.url) : '';
  ds.innerHTML = !sec ? ''
    : (secUrl
        ? '<a href="' + secUrl + '" target="_blank" rel="noopener">'
          + esc(Z(sec.t)) + '<span class="ar">\u203a</span></a>'
        : '<a href="#" class="soon" onclick="return false">'
          + esc(Z(sec.t)) + '<span class="soonmk">' + esc(Z('準備中')) + '</span></a>');
  ds.style.display = sec ? '' : 'none';
  /* 商品名。量（50ml）がある商品は、その右に小さく添える */
  document.getElementById('dname').innerHTML =
      '<span class="nm">' + esc(it.nm) + '</span>'
    + (it.unit ? '<span class="u">（' + esc(it.unit) + '）</span>' : '');
  /* 量を商品名の右に出した商品は、下の行には出さない（同じことを二度書かない） */
  var dsub = document.getElementById('dsub');
  dsub.textContent  = it.unit ? '' : (it.sub || '');
  dsub.style.display = it.unit ? 'none' : '';


  document.getElementById('dtags').innerHTML = (it.tags||[]).map(function(t){
    var cls = /未定/.test(t) ? 'tag warn' : (/元/.test(t) ? 'tag' : 'tag gold');
    return '<span class="'+cls+'">'+t+'</span>';
  }).join('');

  /* ★成分などの箇条書きがある商品は、見出し＋番号つきの並びで出す（2026-09-06 まるちゃん）。
     番号は左に立て、折り返した2行目は成分名の頭にそろう（番号の下にもぐらない）。 */
  var db = document.getElementById('dbody');
  if (it.spec && it.spec.list && it.spec.list.length){
    db.classList.add('haslist');
    db.innerHTML =
        (it.spec.ttl ? '<div class="sttl">' + esc(it.spec.ttl) + '</div>' : '')
      /* ★4行をひとかたまりにして、そのかたまりごと真ん中に置く（2026-09-06 まるちゃん）。
         行ごとに真ん中ぞろえにすると①〜④の位置がバラつくので、かたまりで寄せる。 */
      + '<div class="slist">'
      + it.spec.list.map(function(v, i){
          /* hd を書いた行は「小見出し」。ふつうの行は［番号］［成分名］［説明］ */
          if (v.hd) return '<div class="shd">' + esc(Z(v.hd)) + '</div>';
          return '<div class="srow"><span class="sno">' + esc(v.n || ('①②③④⑤⑥'.charAt(i) || '・')) + '</span>'
               + '<span class="stx">'
               + (v.nm ? ('<b>' + esc(Z(v.nm)) + '</b>') : '')
               + (v.d ? ('<span class="sd' + (v.nm ? '' : ' plain') + '">' + esc(Z(v.d)) + '</span>') : '')
               + '</span></div>';
        }).join('')
      + '</div>';
  } else {
    db.classList.remove('haslist');
    /* 長い説明の商品だけ左そろえにする（2026-09-07 まるちゃん） */
    db.classList.toggle('bodyleft', !!it.bodyLeft);
    /* 説明は行ごとに入れ替える（まとめて1つの文だと対応表と合わないため・2026-09-06） */
    db.textContent = String(it.body || '').split('\n').map(Z).join('\n');
  }

  document.getElementById('dnote').innerHTML = it.note ? '<div class="note">'+it.note+'</div>' : '';

  /* 商品を開き直すたびに、画面1（商品の説明）に戻す。
     本数は、すでにカートに入っている商品ならその本数、初めてなら1本 */
  curItem = it;
  curCat  = cat;   /* 「買い物を続ける」で、この並びの一覧へ戻れるように覚えておく */
  /* すでにカートに入っている大きさがあれば、それを選んだ状態で開く */
  curSize = 0;
  if (it.sizes){
    for (var si = 0; si < it.sizes.length; si++){
      if (cartFind(lineId(it, si)) >= 0){ curSize = si; break; }
    }
  }
  var ci = cartFind(lineId(it, curSize));
  qty = (ci >= 0) ? cart[ci].qty : 1;
  /* 値段と「大きさを選ぶ」欄は、選んでいる大きさに合わせて描く */
  drawPrice();
  drawSizes();
  document.getElementById('buyStart').innerHTML =
    '<span class="t">' + esc(buyLabel(it.nm_btn || it.nm)) + '</span>';
  setStep(0);

  show('item');
  fitItem();
  /* 写真が読み込まれてから大きさが決まることがあるので、少し置いてもう一度合わせる */
  [80, 300, 900].forEach(function(ms){ setTimeout(fitItem, ms); });
}

var curItem = null;

/* 今の日時（お客様のスマホの時計）を「2026/08/31 13:05」の形にする */
function nowText(){
  var d = new Date(), p = function(n){ return (n<10?'0':'') + n; };
  return d.getFullYear() + '/' + p(d.getMonth()+1) + '/' + p(d.getDate())
       + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* 注文の文をあらかじめ書いた状態で、お店のLINEを開くための行き先
   ★日時は「ご注文をお送りするを押した瞬間」を自動で入れる（お客様は何も打たない）。
     押すのはお支払いの直後なので、入金の時刻とほぼ同じになる＝お店で突き合わせやすい。 */
/* ★注文ボタンを押した合図を、お店の窓口へ1つ飛ばす（2026-09-05 まるちゃん決定）。
   事務所のパソコンはこの合図を受け取ると、そこから15分だけLINEを1秒ごとに見て、
   注文が届いた瞬間にお支払いのご案内を返す。
   ・鍵は要らない軽い記録（action=hit）だけを使う＝この住所は既にアプリ側で公開されている物。
   ・失敗しても注文は止めない（合図が飛ばなくても、ふだんの見張りが5秒で気づく）。 */
var SHOP_PIPE = "https://script.google.com/macros/s/"
  + "AKfycbzSxho3e4CHyAuoymGlzcVwGnLshGoCg53zY18laLrHMq5Cun_pBv8XgRsNxKMDxlKwUA/exec";
function orderPing(){
  try{
    var u = SHOP_PIPE + "?action=hit&who=shop&role=customer&view=order&device=page";
    if (navigator.sendBeacon) { navigator.sendBeacon(u); return; }
    fetch(u, { mode:"no-cors", cache:"no-store" }).catch(function(){});
  }catch(e){}
}

function orderLink(payName, payKey){
  if (!LINE_ID || !cart.length) return '';
  var tot = cartTotal();
  var amt = tot!=null ? yen(tot) : 'お値段は追ってご案内します';
  /* ★お客様ご自身のLINEでお店のトークが開くので、どなたかは送られた時点で分かる。
     だからお名前などの記入欄は置かない（そのまま送るだけで済む・2026-08-31まるちゃん）
     ★2026-09-06 まるちゃん決定の書き方＝見出しに合計を入れ、日時とお支払いリンクは入れない。
     お支払いのご案内は、お店から自動で返す文の方で届く（注文の自動返信）。 */
  /* ★中国語版から注文された時は、お店へ届く文も中国語にする（2026-09-06 まるちゃん）。
     ★見出しの書き出し（【ご注文内容 ／ 【訂單內容）で、返す係がどちらの言葉かを見分ける。
       ここを変える時は 注文の自動返信.py も必ず一緒に直すこと。 */
  var zh = isZH();
  var msg = (zh ? '【訂單內容:合計' : '【ご注文内容:合計') + amt + '】\n';
  /* ★1行の書き方＝「商品名　1本のお値段×本数」（2026-09-06 まるちゃん）。
     合計は見出しに出ているので、行ごとの合計は出さない。 */
  cart.forEach(function(l){
    msg += '・' + l.nm + '　'
         + (l.price!=null ? (yen(l.price) + '×' + honLabel(l.qty, l.cw)) : honLabel(l.qty, l.cw))
         + '\n';
  });
  msg += zh
    ? ('付款方式：' + Z(payName) + '\n' + '取貨方式：到店取貨')
    : ('お支払い：' + payName + '\n' + '受け取り：お店で受け取り');
  return 'https://line.me/R/oaMessage/' + encodeURIComponent(LINE_ID) + '/?' + encodeURIComponent(msg);
}

}

/* 郵送でのお受け取り＝蝦皮（Shopee）のお店のページへご案内する（2026-09-06 まるちゃん）。
   飛び先は、その商品に書いてあればそれ、無ければお店のページ。まだ空なら押せない形で出す。 */
function drawNet(){
  var url = (curItem && curItem.shopee) || SHOPEE || '';
  document.getElementById('netBtn').innerHTML = url
     ? '<a class="buy line order" href="' + url + '" target="_blank" rel="noopener">'
       + '<span class="t">蝦皮で購入する</span></a>'
     : '<a class="buy line order" href="#" onclick="return false">'
       + '<span class="t">蝦皮で購入する</span>'
       + '<span class="s">蝦皮のページをご用意でき次第、こちらから開けるようになります</span></a>';
  fitBuys();
}

/* ご注文内容のご確認の中身を組み立てる */
function drawConfirm(){
  var key = curPay;
  var way = PAYWAYS.filter(function(p){ return p.key===key; })[0];
  if (!way || !curItem) return;
  var tot = cartTotal();
  var amt = tot!=null ? yen(tot) : 'お値段は追ってご案内します';

  /* ★商品は「・」で1行ずつ並べ、書き方はお店へ送る注文の文とそろえる（2026-09-06 まるちゃん）。
     長い商品名で折り返しても、2行目が「・」の下にもぐらないようにする。 */
  var rows = '';
  cart.forEach(function(l){
    /* 印は「bl」という名前にする。「dot」は表紙の絵の丸い印がすでに使っていて、
       同じ名前にすると灰色の丸に化ける（2026-09-06に実際に起きた） */
    rows += '<div class="row2 li"><span class="bl">・</span><span class="v2">'
          + l.nm + '　<span class="qp">'
          + (l.price!=null ? (yen(l.price) + '×' + honLabel(l.qty, l.cw)) : honLabel(l.qty, l.cw))
          + '</span></span></div>';
  });
  /* ★商品の行だけを1つの枠にまとめる。たくさん買われた時は、この枠の中だけを
     指でずらして見ていただく形にして、合計・手順・注文ボタンは必ず画面に残す（2026-09-06） */
  document.getElementById('orderBox').innerHTML =
      '<div class="olines" id="oLines">' + rows + '</div>'
    + '<div class="row2"><span class="k">お支払い</span><span class="v">' + way.name + '</span></div>'
    + '<div class="row2"><span class="k">受け取り</span><span class="v">お店で受け取り</span></div>'
    + '<div class="row2 sum"><span class="k">お支払い金額</span><span class="v">' + amt + '</span></div>';

  /* ★ここの文はまるちゃんの指定（2026-09-06）。押してほしい2か所だけ、太い大きな字で目立たせる。
     ③の言い方は、選ばれたお支払い方法に合わせて変える（銀行振込はリンクではなくお振込先が届く）。 */
  /* ★①②③は、つなぎの言葉（「、」など）が言葉ごとに変わるので、日本語と中国語で別に組む */
  var s1, s2, s3;
  if (isZH()){
    s1 = '<em>請按下方的「以此內容下單」</em>';
    s2 = '接著<em>本店的LINE會自動開啟</em>，<em>請直接按下傳送鍵</em>'
       + '（訂單內容已自動填入LINE的輸入欄）';
    s3 = (key === 'bank')
       ? '稍後<em>匯款帳號就會送達</em>'
       : ('稍後<em>' + esc(Z(way.name)) + '的付款連結就會送達</em>');
  } else {
    s1 = '<em>下の「この内容で注文する」を押してください</em>';
    s2 = 'すると<em>当店のLINEが開きますので</em>、<em>そのまま送信ボタンを押してください</em>'
       + '（LINEの入力欄に自動で注文内容が入っています）';
    s3 = (key === 'bank')
       ? 'すぐに<em>お振込先が届きます</em>'
       : ('すぐに' + esc(way.name) + 'の<em>お支払いリンクが届きます</em>');
  }
  document.getElementById('confirmNote').innerHTML =
      '<div class="ost"><span class="no">①</span><span class="tx">' + s1 + '</span></div>'
    + '<div class="ost"><span class="no">②</span><span class="tx">' + s2 + '</span></div>'
    + '<div class="ost"><span class="no">③</span><span class="tx">' + s3 + '</span></div>';

  var href = orderLink(way.name, key);
  document.getElementById('confirmBtn').innerHTML = href
     ? '<a class="buy line order" href="' + href + '" target="_blank" rel="noopener"'
       + ' onclick="orderPing();this.href=orderLink(\'' + way.name + '\',\'' + key + '\')">'   /* 合図を飛ばし、押した瞬間の日時を入れ直す */
       + '<span class="t">この内容で注文する</span></a>'
     : '<a class="buy line order" href="#" onclick="return false">'
       + '<span class="t">この内容で注文する</span>'
       + '<span class="s">お店のLINEの宛先を入れると押せるようになります</span></a>';
  fitBuys();
}


/* ───── 画面1（商品）→ 画面2（受け取り方）→ 画面3（お支払い）と進む ─────
   押すたびに画面がまるごと入れ替わる。「← 前に戻る」で1つずつ戻れる。 */
var payStep = 0;   /* 0＝商品／1＝受け取り方／2＝本数／3＝お支払い／4＝ご確認 */
var qty = 1;       /* いま選んでいる商品の本数（2026-09-02 まるちゃん） */

/* ── カート（2026-09-02 まるちゃん）＝買う物の控え。1商品につき1行 ── */
var cart = [];
function cartFind(id){
  for (var i=0;i<cart.length;i++) if (cart[i].id === id) return i;
  return -1;
}
/* いま見ている商品と本数をカートへ入れる（すでに入っていれば本数を置き換える） */
function cartPut(){
  if (!curItem) return;
  var line = { id:lineId(curItem, curSize), nm:lineName(curItem, curSize),
               price:curPrice(), qty:qty, cw:cntOf(curItem) };
  var i = cartFind(line.id);
  if (i >= 0) cart[i] = line; else cart.push(line);
}
function cartTotal(){
  var t = 0, ok = true;
  cart.forEach(function(l){ if (l.price == null) ok = false; else t += l.price * l.qty; });
  return ok ? t : null;
}
function cartPieces(){
  var n = 0; cart.forEach(function(l){ n += l.qty; }); return n;
}
/* 商品の番号から、その商品と並び（オリジナル／セレクト）を探す */
function findItem(id){
  /* カートの行の名札は「商品の名前#大きさの番号」なので、頭の商品の名前だけで探す */
  var base = String(id).split('#')[0];
  var size = parseInt(String(id).split('#')[1], 10);
  var hit = null;
  ['original','select'].forEach(function(cat){
    (DATA[cat] && DATA[cat].items || []).forEach(function(it){
      if (it.id === base) hit = { cat:cat, it:it, size:(size >= 0 ? size : 0) };
    });
  });
  return hit;
}
/* 右上のカートの印を出し入れする */
function drawCartBtn(){
  var b = document.getElementById('cartBtn');
  if (!b) return;
  var n = cartPieces();
  document.getElementById('cartCnt').textContent = n;
  var onHome = !document.body.classList.contains('dark');
  var showIt = (n > 0 && !onHome);
  b.style.display = showIt ? 'flex' : 'none';
  document.body.classList.toggle('cartshow', showIt);
}
/* カートの中身の画面を組み立てる */
function drawCart(){
  var box = document.getElementById('cartList');
  if (!cart.length){
    box.innerHTML = '<div class="cartempty">カートは空です</div>';
    document.getElementById('cartSum').style.display = 'none';
    document.getElementById('cartBtns').innerHTML =
      '<button class="buy line" type="button" onclick="openList(curCat||\'original\')">'
      + '<span class="t">買い物を続ける</span></button>';
    fitBuys();
    return;
  }
  var h = '';
  cart.forEach(function(l, i){
    h += '<div class="cartrow">'
       +   '<div class="nm">' + l.nm + '</div>'
       +   '<div class="qb">'
       +     '<button type="button" onclick="cartStep(' + i + ',-1)">−</button>'
       +     '<span class="n">' + l.qty + '</span>'
       +     '<button type="button" onclick="cartStep(' + i + ',1)">＋</button>'
       +   '</div>'
       +   '<div class="pr">' + (l.price!=null ? yen(l.price * l.qty) : '') + '</div>'
       + '</div>';
  });
  box.innerHTML = h;
  document.getElementById('cartSum').style.display = '';
  document.getElementById('cartTotal').textContent =
    cartTotal()!=null ? yen(cartTotal()) : 'お値段は追ってご案内します';
  document.getElementById('cartBtns').innerHTML =
      '<button class="buy line" type="button" onclick="openList(curCat||\'original\')">'
    + '<span class="t">買い物を続ける</span></button>'
    + '<button class="buy line" type="button" onclick="cartToPay()">'
    + '<span class="t">お支払いへ進む</span></button>'
    /* ★3つめ＝中身を全部消す（2026-09-06 まるちゃん）。押し間違い防止に一度たずねる */
    + '<button class="buy line empty" id="cartEmpty" type="button" onclick="cartClear()">'
    + '<span class="t">カートを空にする</span></button>';
  fitBuys();
}
/* カートの中身を全部消す（2026-09-06 まるちゃん）。押し間違いが怖いので一度たずねる */
var clearArmed = false, clearTimer = null;
function cartClear(){
  if (!cart.length) return;
  var b = document.getElementById('cartEmpty');
  /* ★1回目は聞き返し、2回目で消す（2026-09-06）。
     ブラウザの「よろしいですか」の小窓は、スマホやアプリの中の画面では
     出ないまま「いいえ」扱いになることがあり、押しても何も起きなかった。 */
  if (!clearArmed){
    clearArmed = true;
    if (b) b.innerHTML = '<span class="t">' + esc(Z('本当に空にしますか？')) + '</span>'
                       + '<span class="s">' + esc(Z('もう一度押すと消えます')) + '</span>';
    if (b) b.classList.add('armed');
    clearTimeoutReset();
    return;
  }
  clearArmed = false;
  cart = [];
  drawCart(); drawCartBtn();
}
/* 5秒さわらなければ、聞き返しをやめて元のボタンに戻す */
function clearTimeoutReset(){
  if (clearTimer) clearTimeout(clearTimer);
  clearTimer = setTimeout(function(){
    clearArmed = false;
    try { drawCart(); } catch(e){}
  }, 5000);
}
/* カートの中で本数を増やす・減らす（0本になったら消す） */
function cartStep(i, d){
  if (!cart[i]) return;
  cart[i].qty += d;
  if (cart[i].qty <= 0) cart.splice(i, 1);
  drawCart(); drawCartBtn();
}
/* カートからお支払いへ */
function cartToPay(){
  if (!cart.length) return;
  var f = findItem(cart[0].id);
  if (f){ curItem = f.it; curCat = f.cat; curSize = f.size || 0; qty = cart[0].qty; }
  show('item');
  setStep(3);
}

/* 本数の表示と、合計金額を書き直す */
function drawQty(){
  var n = document.getElementById('qNum');
  if (n) n.textContent = qty;
  /* 数え方＝ふつうは「本」、セット商品は「セット」（2026-09-06 まるちゃん） */
  var cw = cntOf(curItem);
  var qt = document.getElementById('qTtl'), qu = document.getElementById('qUnit');
  if (qt) qt.textContent = Z(cw + '数をお選びください');
  if (qu) qu.textContent = Z(cw);
  var m = document.getElementById('qMinus');
  if (m) m.disabled = (qty <= 1);
  var t = document.getElementById('qTotal');
  if (t && curItem) t.textContent =
    curPrice()!=null ? yen(curPrice() * qty) : 'お値段は追ってご案内します';
  /* ★上の見出しの金額は「1本のお値段」で固定（本数で変えない・2026-09-02 まるちゃん）。
     合計は下の「お支払い金額」だけに出す。 */
}

function setStep(n){
  payStep = n;
  document.getElementById('stepItem').style.display = (n===0) ? 'block' : 'none';
  /* flex＝左に写真・右に名前と金額を横に並べる（block だと写真が上に乗ってしまう）
     ★ご確認の画面（4）では出さない。下のご注文内容の枠に同じことが全部書いてあるので、
       写真と名前をもう一度出すと同じ話が二度になり、1画面に収まらない（2026-09-06 まるちゃん） */
  document.getElementById('stepHead').style.display = (n===0 || n===4) ? 'none'  : 'flex';
  document.getElementById('stepWay').style.display  = (n===1) ? 'block' : 'none';
  document.getElementById('stepNet').style.display  = (n===5) ? 'block' : 'none';   /* 郵送＝蝦皮 */
  document.getElementById('stepQty').style.display  = (n===2) ? 'block' : 'none';
  /* 本数の画面は、出したあとに詰め具合を決める（下の fitQty・2026-09-06） */
  if (n === 2) setTimeout(fitQty, 0);
  document.getElementById('payPane').style.display  = (n===3) ? 'block' : 'none';
  document.getElementById('stepConfirm').style.display = (n===4) ? 'block' : 'none';

  if (n>0 && curItem){
    /* 上の見出し＝ふだんは今の商品名と「1本のお値段」（本数で変わらない）。
       カートに2つ以上入っている時だけ、まとめて「ご注文 ◯点」と合計にする */
    var many = (n >= 3) && cart.length > 1;
    document.getElementById('stepName').textContent =
      many ? (isZH() ? ('訂單 ' + cartPieces() + '項') : ('ご注文 ' + cartPieces() + '点')) : lineName(curItem, curSize);
    document.getElementById('stepPrice').textContent =
      many ? (cartTotal()!=null ? yen(cartTotal()) : 'お値段は追ってご案内します')
           : (curPrice()!=null ? yen(curPrice()) : 'お値段は追ってご案内します');
    drawQty();
    /* 左の小さな写真（商品の写真と同じ1枚） */
    var sp = document.getElementById('stepPic');
    var spic = itemPic(curItem);
    if (hasPic(spic)){ sp.src = spic; sp.style.display = ''; }
    else { sp.removeAttribute('src'); sp.style.display = 'none'; }
  }
  if (n===3){
    document.getElementById('payRow').innerHTML = PAYWAYS.map(function(p){
      return '<button type="button" class="pay" data-pay="' + p.key + '">' + p.name + '</button>';
    }).join('');
    var btns = document.querySelectorAll('#payRow .pay');
    for (var i=0;i<btns.length;i++){
      btns[i].onclick = (function(k){ return function(){ choosePay(k); }; })(btns[i].getAttribute('data-pay'));
    }
  }
  if (n===5) drawNet();       /* 郵送でのお受け取り＝蝦皮で購入する */
  if (n===4){ drawConfirm(); setTimeout(fitConfirm, 0); }   /* ご注文内容のご確認 */
  fitBuys();   /* 今出したボタンの字を、その場で幅に合わせて収める */
  fitItem();   /* 商品の画面は、写真の高さを残りの場所に合わせる */
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ★2つめからは、お受け取り方法をたずねない（2026-09-07 まるちゃん）。
   すでにカートに入っている＝お店で受け取るを選んだあと、ということなので、
   いきなり本数の画面へ進む。カートを空にすると、また最初からたずねる。
   （郵送を選んだ場合は蝦皮へ行くだけでカートに入らないので、ここには当てはまらない） */
var wayAsked = false;   /* お受け取り方法の画面を通ってきたか（戻る先を決めるのに使う） */
document.getElementById('buyStart').onclick = function(){
  if (cart.length){ wayAsked = false; setStep(2); }
  else { wayAsked = true; setStep(1); }
};
document.getElementById('buyShop').onclick  = function(){ setStep(2); };   /* お店で受け取る → 本数 */
document.getElementById('buyNet').onclick   = function(){ setStep(5); };   /* 郵送で受け取る → 蝦皮 */
/* カートに入れて、商品の一覧へ戻る（買い物を続ける） */
document.getElementById('qKeep').onclick    = function(){ cartPut(); drawCartBtn(); openList(curCat); };
/* カートに入れて、お支払いへ進む */
document.getElementById('qNext').onclick    = function(){ cartPut(); drawCartBtn(); setStep(3); };
/* 右上のカートの印を押したら、中身の画面へ */
document.getElementById('cartBtn').onclick  = function(){ drawCart(); show('cart'); };
document.getElementById('qMinus').onclick   = function(){ if (qty > 1)  { qty--; drawQty(); } };
document.getElementById('qPlus').onclick    = function(){ if (qty < 20) { qty++; drawQty(); } };

document.querySelectorAll('[data-go]').forEach(function(el){
  el.onclick = function(){ openList(el.getAttribute('data-go')); };
});

back.onclick = function(){
  /* カートの中身からは、元の一覧へ戻る */
  if (vCart.style.display !== 'none'){ openList(curCat || 'original'); return; }
  /* お支払い→受け取り方→商品→一覧→ホーム、と1つずつ戻る */
  if (vItem.style.display !== 'none'){
    /* 郵送（5）からは、お受け取り方法をえらぶ画面（1）へ戻す */
    if (payStep === 5) { setStep(1); }
    /* お受け取り方法をたずねずに来た時は、本数の画面から商品の画面へ戻す */
    else if (payStep === 2 && !wayAsked) { setStep(0); }
    else if (payStep > 0) { setStep(payStep - 1); }
    else { openList(curCat); }
  }
  else { show('home'); }
};

show('home');

/* ★これは「写真を入れる前の下書き」を開いた時だけ出る帯（2026-09-06）。
   直すたびにこの下書きがまるちゃんのブラウザに勝手に開いてしまい、写真の場所が
   黒いままなので「写真が出ていない」と何度も混乱させた。開いてしまうこと自体は
   こちらでは止められないので、開いた時にひと目で分かるようにする。本物では出ない。 */
(function(){
  /* 下書きでは差し込み口の文字のまま（@で始まる）。本物では絵の場所が入っている。
     ★ここに差し込み口の文字をそのまま書くと、写真を差し込む係の見張りに引っかかるので書かない。 */
  if (hasPic(ITEM_PICS && ITEM_PICS.vio_oil)) return;
  var bar = document.createElement('div');
  bar.style.cssText =
    'position:fixed;left:0;right:0;top:0;z-index:99999;background:#b4544f;color:#fff;'
    + 'font:700 13px/1.5 system-ui,sans-serif;text-align:center;padding:9px 12px;letter-spacing:.03em';
  bar.textContent = 'これは作業中の下書きです（写真はまだ入っていません）。本物のページは x.gd/TnTSIGNATURE';
  document.body.appendChild(bar);
})();
</script>
