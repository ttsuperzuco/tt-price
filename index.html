<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaiwanTomato料金表</title>

<!-- LINE等のリンクプレビュー(カード)用。これが無いと本文の「よみこみ中…」等が拾われてしまう。客向けのため画像(ズコの絵)は付けない -->
<meta name="description" content="TaiwanTomato">
<meta property="og:type" content="website">
<meta property="og:title" content="料金表・價目表">
<meta property="og:description" content="TaiwanTomato">
<meta property="og:url" content="https://ttsuperzuco.github.io/tt-price/">
<meta property="og:site_name" content="TaiwanTomato">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="料金表・價目表">
<meta name="twitter:description" content="TaiwanTomato">
<style>
  *{
    box-sizing:border-box;
  }

  :root{
    --page-bg:#2b8b9f;
    --page-bg-dark:#23798b;
    --button-top:#f4ffff;
    --button-bottom:#d7f4f5;
    --button-border:#8fcbd1;
    --button-text:#163c59;
    --title-main:#d6f5ff;
    --title-shadow:#16516f;
    --box-bg:#ffffff;
    --link:#007acc;
    --back-top:#ffb347;
    --back-bottom:#ff9800;
    --back-border:#d87400;
    --back-hover-top:#ffc166;
    --back-hover-bottom:#ff8c00;
    --back-text:#ffffff;
  }

  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }

  body{
    font-family:sans-serif;
    background:linear-gradient(to bottom, var(--page-bg), var(--page-bg-dark));
    text-align:center;
    padding:12px;
    margin:0;
    min-height:100vh;
  }

  h2{
    color:var(--title-main);
    margin:6px auto 18px;
    font-size:clamp(30px, 8vw, 54px);
    line-height:1.15;
    max-width:1100px;
    font-weight:900;
    letter-spacing:-1px;
    text-shadow:
      2px 2px 0 var(--title-shadow),
      -2px 2px 0 var(--title-shadow),
      2px -2px 0 var(--title-shadow),
      -2px -2px 0 var(--title-shadow),
      0 3px 6px rgba(0,0,0,0.22);
  }

  #topActions{
    width:100%;
    max-width:1100px;
    margin:8px auto 12px;
  }

  #bottomActions{
    display:none;
    width:100%;
    max-width:1100px;
    margin:22px auto 28px;
  }

  #backBtn,
  #bottomBackBtn{
    display:none;
    width:100%;
    min-height:104px;
    font-size:clamp(34px, 7.4vw, 50px);
    padding:26px 22px;
    border-radius:18px;
    border:3px solid var(--back-border);
    margin:12px 0 18px;
    color:var(--back-text);
    background:linear-gradient(to bottom, var(--back-top), var(--back-bottom));
    text-shadow:
      1px 1px 0 rgba(120,70,0,0.55),
      0 3px 6px rgba(0,0,0,0.22);
    box-shadow:
      0 5px 0 rgba(130,75,0,0.55),
      0 8px 14px rgba(0,0,0,0.28);
  }

  #backBtn:hover,
  #bottomBackBtn:hover{
    background:linear-gradient(to bottom, var(--back-hover-top), var(--back-hover-bottom));
    transform:translateY(-1px);
  }

  #backBtn:active,
  #bottomBackBtn:active{
    transform:translateY(2px);
    box-shadow:
      0 2px 0 rgba(130,75,0,0.55),
      0 4px 9px rgba(0,0,0,0.24);
  }

  #buttons{
    width:100%;
    max-width:1100px;
    margin:0 auto;
  }

  button{
    display:block;
    width:100%;
    min-height:88px;
    margin:10px 0;
    padding:22px 16px;
    line-height:1.22;
    border-radius:14px;
    border:2px solid var(--button-border);
    cursor:pointer;
    color:var(--button-text);
    font-weight:900;
    background:linear-gradient(to bottom, var(--button-top), var(--button-bottom));
    box-shadow:
      0 4px 0 rgba(10,70,86,0.28),
      0 7px 12px rgba(0,0,0,0.25);
    transition:0.15s;
    text-align:center;
    white-space:normal;
    word-break:keep-all;
    overflow-wrap:break-word;
  }

  .buttonTitle{
    display:block;
    font-size:clamp(32px, 8vw, 52px);
    line-height:1.18;
    font-weight:900;
  }

  .buttonSub{
    display:block;
    margin-top:8px;
    font-size:clamp(18px, 4.4vw, 30px);
    line-height:1.35;
    font-weight:700;
    opacity:0.92;
  }

  button.hasSub{
    padding-top:20px;
    padding-bottom:20px;
  }

  button.hasSub .buttonTitle{
    font-size:clamp(30px, 7.2vw, 48px);
  }

  button:hover{
    background:linear-gradient(to bottom,#ffffff,#c8eef0);
    transform:translateY(-1px);
  }

  button:active{
    transform:translateY(2px);
    box-shadow:
      0 2px 0 rgba(10,70,86,0.28),
      0 3px 8px rgba(0,0,0,0.22);
  }

  #boxWrap{
    display:none;
    margin:20px auto 0;
    width:100%;
    max-width:1100px;
  }

  #box{
    padding:30px;
    min-height:260px;
    background:var(--box-bg);
    border-radius:14px;
    white-space:pre-wrap;
    text-align:left;
    line-height:1.75;
    font-size:clamp(30px, 6.5vw, 46px);
    font-weight:500;
    pointer-events:auto;
    box-shadow:
      0 4px 0 rgba(10,70,86,0.18),
      0 7px 14px rgba(0,0,0,0.18);
  }

  #box a{
    color:var(--link);
    text-decoration:underline;
    cursor:pointer;
    pointer-events:auto;
    word-break:break-all;
    font-size:inherit;
  }

  /* ★2026-11-26 まるちゃん「キャンペーンの背景だけ目立つ色に」＝名前が🔥で始まるボタンは金色の背景・赤茶の文字 */
  button.campaign{
    background:linear-gradient(to bottom, #fff7c2, #ffd23f);
    border:2px solid #e0a100;
    color:#8a2a00;
    box-shadow:
      0 4px 0 rgba(160,100,0,0.45),
      0 7px 12px rgba(0,0,0,0.25);
  }
  button.campaign .buttonTitle{ font-size:clamp(17px, 4.6vw, 30px) !important; }
  button.campaign .buttonSub{ font-size:clamp(16px, 4.3vw, 28px) !important; opacity:1; color:#7a2600; }
  .buttonSub .em{
    display:block;
    margin:4px auto 2px;
    font-size:clamp(25px, 6.8vw, 44px);
    font-weight:900;
    color:#c8102e;
    line-height:1.2;
    text-shadow:0 1px 0 #fff, 0 0 6px rgba(255,255,255,0.9);
  }
  button.campaign:hover{ background:linear-gradient(to bottom, #fffbe0, #ffdc66); }

  /* ★2026-11-26 キャンペーンの画像を料金表の中にそのまま出す（本文の1行が当店の置き場の画像の住所だけの時） */
  #box img.boxImg{ display:block; width:100%; height:auto; border-radius:10px; margin:4px 0; }

  #loading{
    color:#fff;
    font-size:22px;
    font-weight:700;
    opacity:0.9;
    padding:40px 12px;
  }

  /* ★2026-11-25 まるちゃん：男女・言語別の開き方では見出しを1行に（言語に合わせた見出しだけを出す） */
  h2.one-line{ white-space:nowrap; font-size:min(54px, 7.4vw) !important; letter-spacing:0; }

  @media (max-width: 480px){
    /* ★2026-11-26 まるちゃん「スマホで開くとすごく大きくて見にくい」＝スマホの文字を小さくした（前は本文30px・ボタン30〜31px） */
    body{
      padding:8px;
    }

    h2{
      font-size:24px;
      margin:2px auto 10px;
      line-height:1.15;
    }

    h2.one-line{ font-size:min(24px, 6.4vw) !important; }

    #topActions{
      margin:4px auto 6px;
    }

    button{
      min-height:54px;
      padding:12px 10px;
      margin:7px 0;
      border-radius:10px;
    }

    .buttonTitle{
      font-size:20px;
    }

    .buttonSub{
      font-size:14px;
      line-height:1.35;
      margin-top:4px;
    }

    button.hasSub .buttonTitle{
      font-size:19px;
    }

    #backBtn,
    #bottomBackBtn{
      min-height:52px;
      font-size:19px;
      padding:12px 10px;
      border-radius:12px;
      margin:6px 0 10px;
      border-width:2px;
    }

    #box{
      padding:16px;
      font-size:17px;
      line-height:1.7;
      border-radius:12px;
    }
  }
</style>
</head>
<body>

<h2 id="title">よみこみ中…</h2>

<div id="loading">よみこみ中…</div>

<div id="topActions">
  <button id="backBtn">← 前へ戻る（返回上一頁）</button>
</div>

<div id="buttons"></div>

<div id="boxWrap">
  <div id="box"></div>
</div>

<div id="bottomActions">
  <button id="bottomBackBtn">← 前へ戻る（返回上一頁）</button>
</div>

<script>
// Googleの本体(script.google.com/.../exec)には画面を直接開かせない。
// <script src>でデータだけをJSONP取得する（サブリソース扱いのため、
// Google側の「未確認アプリです」という警告画面が出ない）。
var EXEC = "https://script.google.com/macros/s/AKfycbz6BLbUnhOywMkM81omaj5O5JQ7srn0Rejbb_25u4sS6vLuZSG5MoNU4Ay-LMBWshND/exec";

var titleEl = document.getElementById('title');
var loadingEl = document.getElementById('loading');
var buttons = document.getElementById('buttons');
var backBtn = document.getElementById('backBtn');
var bottomActions = document.getElementById('bottomActions');
var bottomBackBtn = document.getElementById('bottomBackBtn');
var boxWrap = document.getElementById('boxWrap');
var box = document.getElementById('box');

var ROWS = [];
var curPath = [];

// ★2026-11-25 まるちゃん決定：男女・言語別の4つの開き方。リンクの最後に ?v=FJ／MJ／FC／MC を付ける
//   （F=女性 M=男性／J=日本語 C=中文）。付けなければ今までどおり言語を選ぶ画面から始まる。
//   女性用＝男性の脱毛を出さない。男性用＝下の言葉が名前に入っている物だけ出す（男性脱毛・ハイドラ・プロセル顔・頭皮）。
//   料金表のタブで施術の名前を変える時は、この言葉が残るようにする（消えると男性用に出なくなる）。
var VIEW = (function(){ try { return (new URLSearchParams(location.search).get('v') || '').toUpperCase(); } catch (e) { return ''; } })();
var VIEW_LANG = { J: '日本語 料金表', C: '中文 價目表' };
var BASE = /^[FM][JC]$/.test(VIEW) ? [VIEW_LANG[VIEW.charAt(1)]] : [];
var MEN_KEYS = ['男性', 'ハイドラ', '水飛梭', 'プロセル', 'Procell', '眉'];   // ★2026-11-26 眉（眉デザイン＆マツエク）も男性用に出す＝プロセルの下に並ぶ
// ★2026-11-26 まるちゃん：期間限定キャンペーンのボタンは表の一番下に足す＝料金表でも一番下に並ぶ（まるちゃん「キャンペーンは一番下」）。
//   男女どちらか向けのボタンは、本文の1行目に「#男性」「#女性」と書く（お客様には出さない印）。
function rowGender(r){ var m = String(r.body || '').match(/^\s*#(男性|女性)/); return m ? m[1] : ''; }
function stripTag(body){ return String(body || '').replace(/^\s*#(男性|女性)[^\n]*\n?/, ''); }
function viewFilter(rows){
  if (!BASE.length) return rows;
  var out = rows.filter(function(r){
    if (r.path[0] !== BASE[0]) return false;
    var g = rowGender(r);
    if (g) return VIEW.charAt(0) === (g === '男性' ? 'M' : 'F');
    var name = r.path[1] || '';
    if (VIEW.charAt(0) === 'F') return name.indexOf('男性') < 0;
    for (var i = 0; i < MEN_KEYS.length; i++) if (name.indexOf(MEN_KEYS[i]) >= 0) return true;
    return false;
  });
  if (out.length) return out;
  BASE = []; curPath = [];          // 名前が変わって1つも残らない時は、白い画面にせず全部を出す
  return rows;
}
curPath = BASE.slice();

function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function parseButtonLabel(label){
  var raw = String(label || '').trim();

  if (raw.indexOf('||') >= 0) {
    var parts = raw.split('||');
    return {
      title: String(parts[0] || '').trim(),
      sub: parts.slice(1).join('||').trim()
    };
  }

  var lines = raw.split(/\r?\n/).map(function(v){ return String(v || '').trim(); }).filter(function(v){ return v !== ''; });

  if (lines.length >= 2) {
    return {
      title: lines[0],
      sub: lines.slice(1).join(' ')
    };
  }

  return {
    title: raw,
    sub: ''
  };
}

function setButtonContent(button, label){
  var parsed = parseButtonLabel(label);

  button.innerHTML = '';

  var titleSpan = document.createElement('span');
  titleSpan.className = 'buttonTitle';
  titleSpan.textContent = parsed.title || String(label || '');

  button.appendChild(titleSpan);

  if (parsed.sub) {
    button.classList.add('hasSub');

    var subSpan = document.createElement('span');
    subSpan.className = 'buttonSub';
    // ★2026-11-26 まるちゃん「VIO脱毛・ヒゲ脱毛と眉デザインの文字を目立つように（一番大事）」
    //   表の説明に【 】で囲んだ言葉は、大きな赤い字で1行に出す（【 】の印はお客様には出さない）。
    subSpan.innerHTML = escapeHtml(parsed.sub).replace(/【([^】]+)】/g, '<span class="em">$1</span>');

    button.appendChild(subSpan);
  } else {
    button.classList.remove('hasSub');
  }
}

function getPreviousNonEmptyLine(lines, currentIndex){
  for (var i = currentIndex - 1; i >= 0; i--){
    var v = String(lines[i] || '').trim();
    if (v !== '') return v;
  }
  return '';
}

var IMG_LINE = /^https:\/\/ttsuperzuco\.github\.io\/\S+\.(jpg|jpeg|png|webp)(\?\S*)?$/i;
function linkifyLine(originalLine, urlLabel){
  var line = String(originalLine || '');
  if (IMG_LINE.test(line.trim())) return '<img class="boxImg" src="' + escapeHtml(line.trim()) + '" alt="">';
  var urlRegex = /(https?:\/\/[^\s<]+)/g;

  var html = '';
  var lastIndex = 0;
  var match;

  while ((match = urlRegex.exec(line)) !== null) {
    var url = match[0];

    html += escapeHtml(line.slice(lastIndex, match.index));

    var safeUrl = escapeHtml(url);
    var safeLabel = escapeHtml(urlLabel || '');

    html += '<a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer">' + safeUrl + '</a>';

    lastIndex = match.index + url.length;
  }

  html += escapeHtml(line.slice(lastIndex));

  return html;
}

function linkify(text){
  var lines = String(text == null ? '' : text).split(/\r?\n/);

  return lines.map(function(line, idx){
    var urlLabel = getPreviousNonEmptyLine(lines, idx);
    return linkifyLine(line, urlLabel);
  }).join("<br>");
}

function setBox(text){
  box.innerHTML = linkify(text || "");
}

function showBox(){
  boxWrap.style.display = 'block';
}

function hideBox(){
  boxWrap.style.display = 'none';
  box.innerHTML = '';
}

function hideBottomBack(){
  bottomActions.style.display = 'none';
  bottomBackBtn.style.display = 'none';
}

function showBottomBack(){
  bottomActions.style.display = 'block';
  bottomBackBtn.style.display = 'block';
}

function startsWithPath(rowPath, prefix){
  if (prefix.length > rowPath.length) return false;

  for (var i = 0; i < prefix.length; i++){
    if (rowPath[i] !== prefix[i]) return false;
  }

  return true;
}

function candidates(){
  return ROWS.filter(function(r){ return startsWithPath(r.path, curPath); });
}

function nextOptions(){
  var cand = candidates();
  var depth = curPath.length;
  var seen = {};
  var out = [];

  for (var i = 0; i < cand.length; i++){
    var r = cand[i];
    if (r.path.length > depth){
      var v = r.path[depth];

      if (v && !seen[v]) {
        seen[v] = true;
        out.push(v);
      }
    }
  }

  return out;
}

function leafRow(){
  for (var i = 0; i < ROWS.length; i++){
    var r = ROWS[i];
    if (r.path.length !== curPath.length) continue;
    if (startsWithPath(r.path, curPath)) return r;
  }

  return null;
}

function render(){
  buttons.innerHTML = '';

  var isTop = curPath.length <= BASE.length;

  backBtn.style.display = isTop ? 'none' : 'block';

  if (isTop) {
    hideBottomBack();
  } else {
    showBottomBack();
  }

  var leaf = leafRow();

  if (leaf){
    showBox();
    setBox(stripTag(leaf.body));
    return;
  }

  hideBox();

  var opts = nextOptions();

  if (opts.length === 0){
    showBox();
    setBox("表示できる内容がありません。しばらくしてからもう一度お試しください。");
    return;
  }

  for (var i = 0; i < opts.length; i++){
    (function(val){
      var b = document.createElement('button');

      setButtonContent(b, val);
      if (String(val).indexOf('🔥') === 0) b.classList.add('campaign');

      b.onclick = function(){
        // ★2026-11-26 本文がリンク1つだけのボタンは、押したらそのページ（ブログ等）へ直接移る
        var next = curPath.concat([val]);
        for (var k = 0; k < ROWS.length; k++){
          var rr = ROWS[k];
          if (rr.path.length === next.length && startsWithPath(rr.path, next)) {
            var only = stripTag(rr.body).trim();
            if (/^https?:\/\/\S+$/.test(only) && !IMG_LINE.test(only)) { location.href = only; return; }
            break;
          }
        }
        curPath.push(val);
        render();

        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      buttons.appendChild(b);
    })(opts[i]);
  }
}

function goBack(){
  if (curPath.length > BASE.length) curPath.pop();

  // Googleの新しい中身が届いていたら、最初の画面に戻った時に入れ替える（見ている途中で飛ばさない）
  if (curPath.length === BASE.length && waitingPayload) {
    var p = waitingPayload;
    waitingPayload = null;
    applyPayload(p, false);
  }

  render();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

backBtn.onclick = goBack;
bottomBackBtn.onclick = goBack;

// ★★2026-09-23 まるちゃん「スマホでひらいたらおそかった」への直し。
//   ページそのものは0.1秒で届くのに、中身をGoogleに聞きに行くところで**毎回2.5秒**待っていた
//   （スマホの回線だともっとかかる）。そこで、事務所パソコンが同じ中身の写し(data.js)を
//   **このページと同じ場所**に置いておき、開いた瞬間はそれを出す。
//   そのあと今までどおりGoogleにも聞き、中身が変わっていた時だけ静かに入れ替える。
//   お客様が中を開いている最中は入れ替えず、最初の画面に戻った時に入れ替える（画面が飛ばない）。
var shownSig = '';
var waitingPayload = null;

function applyPayload(payload, fromLocal){
  var data = payload || {};
  var rows = data.rows || [];

  if (rows.length === 0) {
    if (fromLocal) return;                 // 写しが空の時は何もしない（Googleの答えを待つ）
    loadingEl.style.display = 'none';
    showBox();
    setBox("表示できる内容がありません。しばらくしてからもう一度お試しください。");
    return;
  }

  var sig;
  try { sig = JSON.stringify(rows); } catch (e) { sig = String(rows.length); }

  if (sig === shownSig) return;            // 中身が同じ＝画面はいじらない
  if (!fromLocal && shownSig && curPath.length > BASE.length) { waitingPayload = payload; return; }

  shownSig = sig;
  ROWS = viewFilter(rows);
  // ★2026-11-25 まるちゃん：日本語の開き方は「TaiwanTomato料金表」、中文は「TaiwanTomato價目表」だけを1行で出す
  if (BASE.length) {
    titleEl.textContent = VIEW.charAt(1) === 'C' ? 'TaiwanTomato價目表' : 'TaiwanTomato料金表';
    titleEl.classList.add('one-line');
    document.title = titleEl.textContent;
  } else {
    titleEl.textContent = data.appName || 'TaiwanTomato料金表';
  }
  loadingEl.style.display = 'none';

  render();
}

window.__ttPriceLocal = function(payload){ applyPayload(payload, true); };
window.__ttPriceData  = function(payload){ applyPayload(payload, false); };

(function(){
  // ①同じ場所に置いてある写しを先に読む（つなぎ直しが要らないのですぐ出る）
  var a = document.createElement('script');
  a.src = 'data.js?cb=' + Date.now();
  document.head.appendChild(a);

  // ②そのあとGoogleにも聞く（新しくなっていれば静かに入れ替える）
  var s = document.createElement('script');
  s.src = EXEC + '?action=data&callback=__ttPriceData&cb=' + Date.now();
  s.onerror = function(){
    if (!shownSig) loadingEl.textContent = '読み込みに失敗しました。時間をおいて開き直してください。';
  };
  document.head.appendChild(s);
})();
</script>

</body>
</html>
